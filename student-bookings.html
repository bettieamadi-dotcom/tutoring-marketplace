<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | Tutor Pearl</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f3fc;
    color: #211038;
}

header {
    background: #211038;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h2 {
    margin: 0;
}

header a {

    text-decoration: none;

}

main {
    max-width: 1050px;
    margin: 35px auto;
    padding: 0 18px;
}

h1 {
    margin-bottom: 8px;
}

.intro {
    color: #6c6079;
    margin-bottom: 25px;
    line-height: 1.6;
}

.booking {
    background: white;

    padding: 22px;

    box-shadow: 0 4px 15px #21103812;
}

.booking h3 {

}

.tutor-profile {

    align-items: center;
    gap: 15px;
    margin: 18px 0;

    background: #f7f3fc;
    border-radius: 12px;
}

.tutor-photo {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    object-fit: cover;
    background: #e7dbff;
    flex-shrink: 0;
}

.tutor-info {
    min-width: 0;
}

.tutor-name {
    color: #6d42a5;
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 5px;
}

.tutor-headline {
    color: #6c6079;
    font-size: 14px;
    line-height: 1.5;
}

.details {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin: 18px 0;
}

.label {
    font-size: 12px;
    color: #82758e;
    margin-bottom: 5px;
}

.value {
    font-weight: 600;
    overflow-wrap: anywhere;
}

.status {
    display: inline-block;
    padding: 8px 13px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    text-transform: capitalize;
}

.pending {
    background: #fff2cf;
    color: #805600;
}

.accepted,
.approved {
    background: #dff7e8;
    color: #17643b;
}

.declined,
.cancelled {
    background: #ffe2e2;
    color: #a32626;
}

.completed {
    background: #e8e1ff;
    color: #51329b;
}

.message {
    background: #f7f3fc;
    padding: 13px;
    border-radius: 9px;
    margin-top: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

button {
    background: #6d42a5;
    color: white;
    border: 0;
    padding: 11px 17px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}

button:hover {
    background: #513078;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.cancel-button {
    background: #b42318;
    margin-top: 16px;
}

.cancel-button:hover {
    background: #8f1b13;
}

.reschedule-section {
    background: #f7f3fc;
    border: 1px solid #e7dbff;
    padding: 18px;
    border-radius: 12px;
    margin-top: 20px;
}

.reschedule-section h4 {
    margin-top: 0;
    color: #513078;
}

.reschedule-form {
    display: grid;
    gap: 13px;
    margin-top: 15px;
}

.reschedule-form label {
    font-size: 13px;
    font-weight: bold;
}

.reschedule-form input,
.reschedule-form textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #d8cde5;
    border-radius: 8px;
    background: white;
    color: #211038;
    font-family: Arial, sans-serif;
}

.reschedule-form textarea {
    min-height: 85px;
    resize: vertical;
}

.reschedule-note {
    color: #6c6079;
    font-size: 13px;
    line-height: 1.6;

.request-card {
    background: white;
    padding: 13px;
    border-radius: 9px;
    margin-top: 12px;
    border: 1px solid #e7dbff;

.request-card p {

/* STUDENT REVIEW STYLES */

.review-section {
    background: #faf7ff;
    border: 1px solid #e7dbff;
    padding: 20px;
    border-radius: 12px;
    margin-top: 20px;
}

.review-section h4 {

    margin-top: 0;

}

.review-note {

    line-height: 1.6;

.review-form {

    gap: 14px;

.review-form label {

}

.review-form select,
.review-form textarea {

.review-form select:focus,

.review-stars {

.review-success {

.review-success h4 {

<script type="module">

import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
"https://chmdsvfmlscrbqomqifp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const bookingsContainer =
document.getElementById("bookings");

const notice =
document.getElementById("notice");

const refreshBtn =
document.getElementById("refreshBtn");

let loading = false;
let currentRequests = [];
let currentReviews = {};

function showNotice(text, isError = false) {
    notice.textContent = text;
    notice.style.display = "block";

    notice.className = isError
        ? "notice error"
        : "notice";
}

function hideNotice() {
    notice.style.display = "none";
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function formatDate(value) {
    if (!value) return "Not specified";

    const date = new Date(value + "T00:00:00");

    return date.toLocaleDateString(undefined, {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function formatTime(value) {
    if (!value) return "Not specified";

    const parts = value.split(":");

    const date = new Date();

    date.setHours(
        Number(parts[0]),
        Number(parts[1]),
        0,
        0
    );

    return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

function getLocalDate() {
    const now = new Date();

    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");

    return `${year}-${month}-${day}`;
}

function getInitials(name) {
    return String(name || "Tutor")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0).toUpperCase())
        .join("");
}

function createTutorPhoto(tutor) {

    const photo = document.createElement("img");

    photo.className = "tutor-photo";

    photo.alt = tutor?.full_name || "Tutor";

    photo.src = tutor?.profile_photo_url || "";

    photo.onerror = () => {

        const fallback = document.createElement("div");

        fallback.className = "tutor-photo";

        fallback.style.display = "flex";
        fallback.style.alignItems = "center";
        fallback.style.justifyContent = "center";
        fallback.style.fontWeight = "bold";
        fallback.style.color = "#513078";

        fallback.textContent = getInitials(
            tutor?.full_name
        );

        photo.replaceWith(fallback);
    };

    if (!tutor?.profile_photo_url) {
        photo.onerror();
    }

    return photo;
}

function createDetail(label, value) {

    const wrapper = document.createElement("div");

    const labelElement = document.createElement("div");
    labelElement.className = "label";
    labelElement.textContent = label;

    const valueElement = document.createElement("div");
    valueElement.className = "value";

    if (Array.isArray(value)) {
        valueElement.textContent =
            value.length ? value.join(", ") : "Not specified";
    } else {
        valueElement.textContent =
            value || "Not specified";
    }

    wrapper.append(labelElement, valueElement);

    return wrapper;
}

function createStatus(statusValue) {

    const allowedStatuses = [
        "pending",
        "accepted",
        "declined",
        "cancelled",
        "completed"
    ];

    const status = String(
        statusValue || "pending"
    ).toLowerCase();

    const safeStatus = allowedStatuses.includes(status)
        ? status
        : "pending";

    const wrapper = document.createElement("div");

    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "Booking status";

    const badge = document.createElement("span");
    badge.className = "status " + safeStatus;
    badge.textContent = safeStatus;

    wrapper.append(label, badge);

    return wrapper;
}

async function cancelBooking(booking, button) {

    const confirmed = window.confirm(
        "Are you sure you want to cancel this lesson booking?"
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Cancelling...";

    try {

        const { data, error } = await supabase.rpc(
            "student_cancel_booking",
            {
                booking_id: booking.id
            }
        );

        if (error) throw error;

        if (data !== true) {
            throw new Error(
                "The booking could not be cancelled. Please refresh and try again."
            );
        }

        await loadBookings();

        showNotice(
            "Your lesson booking has been cancelled successfully."
        );

    } catch (error) {

        console.error("Booking cancellation error:", error);

        showNotice(
            error.message ||
            "Unable to cancel this booking. Please try again.",
            true
        );

        button.disabled = false;
        button.textContent = "Cancel Booking";
    }
}

/* STUDENT REVIEW FUNCTIONS */

function createReviewSection(booking) {

    const section = document.createElement("div");

    section.className = "review-section";

    const heading = document.createElement("h4");
    heading.textContent = "Review Your Tutor";

    section.appendChild(heading);

    const existingReview = currentReviews[booking.id];

    if (existingReview) {

        const success = document.createElement("div");

        success.className = "review-success";

        const title = document.createElement("h4");
        title.textContent = "Your review has been submitted";

        const stars = document.createElement("div");

        stars.className = "review-stars";

        stars.textContent =
            "★".repeat(existingReview.rating) +
            "☆".repeat(5 - existingReview.rating);

        const ratingText = document.createElement("p");

        ratingText.textContent =
            existingReview.rating + " out of 5 stars";

        success.append(
            title,
            stars,
            ratingText
        );

        if (existingReview.review_text) {

            const reviewText = document.createElement("p");

            reviewText.className = "review-text";

            reviewText.textContent =
                existingReview.review_text;

            success.appendChild(reviewText);
        }

        const date = document.createElement("p");

        date.className = "review-note";

        date.textContent =
            "Submitted on " +
            formatDate(
                String(existingReview.created_at).substring(0, 10)
            );

        success.appendChild(date);

        section.appendChild(success);

        return section;
    }

    const note = document.createElement("p");

    note.className = "review-note";

    note.textContent =
        "Your lesson is completed! Share your experience to help other students learn about this tutor.";

    const form = document.createElement("form");

    form.className = "review-form";

    const ratingLabel = document.createElement("label");

    ratingLabel.textContent = "Your rating";

    const ratingSelect = document.createElement("select");

    ratingSelect.name = "rating";
    ratingSelect.required = true;

    ratingSelect.innerHTML = `
        <option value="">Select a rating</option>
        <option value="5">★★★★★ - Excellent</option>
        <option value="4">★★★★☆ - Very good</option>
        <option value="3">★★★☆☆ - Good</option>
        <option value="2">★★☆☆☆ - Fair</option>
        <option value="1">★☆☆☆☆ - Poor</option>
    `;

    ratingLabel.appendChild(ratingSelect);

    const reviewLabel = document.createElement("label");

    reviewLabel.textContent =
        "Write your review (optional)";

    const reviewTextarea = document.createElement("textarea");

    reviewTextarea.name = "review_text";
    reviewTextarea.maxLength = 1000;

    reviewTextarea.placeholder =
        "Tell us about your learning experience with this tutor.";

    reviewLabel.appendChild(reviewTextarea);

    const submitButton = document.createElement("button");

    submitButton.type = "submit";

    submitButton.className = "review-submit";

    submitButton.textContent = "Submit Review";

    form.append(
        ratingLabel,
        reviewLabel,
        submitButton
    );

    form.addEventListener("submit", async event => {

        event.preventDefault();

        const rating = Number(ratingSelect.value);

        const reviewText = reviewTextarea.value.trim();

        if (!Number.isInteger(rating) || rating < 1 || rating > 5) {

            showNotice(
                "Please select a rating between 1 and 5 stars.",
                true
            );

            return;
        }

        const confirmed = window.confirm(
            "Are you sure you want to submit this tutor review?"
        );

        if (!confirmed) return;

        submitButton.disabled = true;

        submitButton.textContent = "Submitting...";

        try {

            const { data, error } = await supabase.rpc(
                "student_submit_review",
                {
                    p_booking_id: booking.id,
                    p_rating: rating,
                    p_review_text: reviewText || null
                }
            );

            if (error) throw error;

            if (!data) {
                throw new Error(
                    "Your review could not be submitted."
                );
            }

            await loadBookings();

            showNotice(
                "Thank you! Your tutor review has been submitted successfully."
            );

        } catch (error) {

            console.error("Review submission error:", error);

            showNotice(
                error.message ||
                "Unable to submit your review. Please try again.",
                true
            );

            submitButton.disabled = false;

            submitButton.textContent = "Submit Review";
        }
    });

    section.append(
        note,
        form
    );

    return section;
}

/* RESCHEDULING FUNCTIONS */

function renderRescheduleRequests(booking) {

    const requests = currentRequests.filter(
        request => request.booking_id === booking.id
    );

    if (!requests.length) return null;

    const wrapper = document.createElement("div");

    wrapper.className = "reschedule-section";

    const heading = document.createElement("h4");
    heading.textContent = "Rescheduling requests";

    wrapper.appendChild(heading);

    requests.forEach(request => {

        const card = document.createElement("div");

        card.className = "request-card";

        const date = document.createElement("p");
        date.innerHTML =
            "<strong>Requested date:</strong> " +
            escapeHTML(formatDate(request.requested_date));

        const time = document.createElement("p");
        time.innerHTML =
            "<strong>Requested time:</strong> " +
            escapeHTML(formatTime(request.requested_start_time));

        const status = document.createElement("p");

        const statusValue = String(
            request.status || "pending"
        ).toLowerCase();

        const allowed = [
            "pending",
            "approved",
            "declined",
            "cancelled"
        ];

        const safeStatus = allowed.includes(statusValue)
            ? statusValue
            : "pending";

        status.innerHTML =
            "<strong>Request status:</strong> ";

        const badge = document.createElement("span");
        badge.className = "status " + safeStatus;
        badge.textContent = safeStatus;

        status.appendChild(badge);

        card.append(date, time, status);

        if (request.student_message) {

            const message = document.createElement("p");

            message.textContent =
                "Your message: " + request.student_message;

            card.appendChild(message);
        }

        wrapper.appendChild(card);
    });

    return wrapper;
}

async function submitReschedule(
    booking,
    form,
    button
) {

    const dateInput = form.querySelector(
        '[name="requested_date"]'
    );

    const timeInput = form.querySelector(
        '[name="requested_start_time"]'
    );

    const messageInput = form.querySelector(
        '[name="student_message"]'
    );

    const requestedDate = dateInput.value;
    const requestedTime = timeInput.value;

    if (!requestedDate || !requestedTime) {
        showNotice(
            "Please select both a new date and time.",
            true
        );
        return;
    }

    if (requestedDate < getLocalDate()) {
        showNotice(
            "Please choose a future date.",
            true
        );
        return;
    }

    if (
        requestedDate === booking.lesson_date &&
        requestedTime === booking.start_time.substring(0, 5)
    ) {
        showNotice(
            "Please choose a different date or time.",
            true
        );
        return;
    }

    const confirmed = window.confirm(
        "Send this rescheduling request to your tutor?"
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Sending request...";

    try {

        const { data, error } = await supabase.rpc(
            "student_request_reschedule",
            {
                p_booking_id: booking.id,
                p_requested_date: requestedDate,
                p_requested_start_time: requestedTime,
                p_student_message: messageInput.value.trim() || null
            }
        );

        if (error) throw error;

        if (!data) {
            throw new Error(
                "Your rescheduling request could not be submitted."
            );
        }

        await loadBookings();

        showNotice(
            "Your rescheduling request has been sent to your tutor."
        );

    } catch (error) {

        console.error("Rescheduling request error:", error);

        showNotice(
            error.message ||
            "Unable to send your rescheduling request.",
            true
        );

        button.disabled = false;
        button.textContent = "Send Rescheduling Request";
    }
}

function createRescheduleForm(booking) {

    const section = document.createElement("div");

    section.className = "reschedule-section";

    const heading = document.createElement("h4");
    heading.textContent = "Reschedule this lesson";

    const note = document.createElement("p");

    note.className = "reschedule-note";

    note.textContent =
        "Choose your preferred new date and time. Your tutor must approve the request before your booking changes. Your requested time must fit the tutor's availability.";

    const form = document.createElement("form");

    form.className = "reschedule-form";

    const dateLabel = document.createElement("label");

    const dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.name = "requested_date";
    dateInput.required = true;
    dateInput.min = getLocalDate();

    dateLabel.appendChild(dateInput);

    const timeLabel = document.createElement("label");
    timeLabel.textContent = "New lesson time";

    const timeInput = document.createElement("input");
    timeInput.type = "time";
    timeInput.name = "requested_start_time";
    timeInput.step = "1800";
    timeInput.required = true;

    timeLabel.appendChild(timeInput);

    const messageLabel = document.createElement("label");
    messageLabel.textContent = "Message to your tutor (optional)";

    const messageInput = document.createElement("textarea");
    messageInput.name = "student_message";
    messageInput.maxLength = 1000;
    messageInput.placeholder =
        "Let your tutor know why you need to reschedule.";

    messageLabel.appendChild(messageInput);

    const submitButton = document.createElement("button");

    submitButton.type = "submit";

    submitButton.textContent =

    form.append(

            booking,
            form,
            submitButton
        );
    });

    section.append(
        heading,
        note,
        form
    );

    return section;
}

/* BOOKING DISPLAY */

function renderBooking(booking, tutor) {

    const card = document.createElement("section");

    card.className = "booking";

    const subject = document.createElement("h3");

    subject.textContent =
        booking.subject || "Lesson request";

    const profile = document.createElement("div");

    profile.className = "tutor-profile";

    profile.appendChild(
        createTutorPhoto(tutor)
    );

    const info = document.createElement("div");

    info.className = "tutor-info";

    const name = document.createElement("div");

    name.className = "tutor-name";

    name.textContent =
        tutor?.full_name || "Tutor";

    const headline = document.createElement("div");

    headline.className = "tutor-headline";

    headline.textContent =
        tutor?.headline || "Tutor Pearl tutor";

    info.append(name, headline);

    profile.appendChild(info);

    const details = document.createElement("div");

    details.className = "details";

    details.append(
        createDetail(
            "Teaching languages",
            tutor?.teaching_languages
        ),
        createDetail(
            "Qualifications",
            tutor?.qualifications
        ),
        createDetail(
            "Lesson date",
            formatDate(booking.lesson_date)
        ),
        createDetail(
            "Start time",
            formatTime(booking.start_time)
        ),
        createDetail(
            "Duration",
            booking.duration_minutes + " minutes"
        )
    );

    details.appendChild(
        createStatus(booking.status)
    );

    card.append(
        subject,
        profile,
        details
    );

    if (booking.student_message) {

        const message = document.createElement("div");

        message.className = "message";

        const strong = document.createElement("strong");

        strong.textContent = "Your message:";

        const text = document.createElement("div");

        text.textContent = booking.student_message;

        message.append(strong, text);

        card.appendChild(message);
    }

    const status = String(
        booking.status || ""
    ).toLowerCase();

    /* REVIEW SECTION FOR COMPLETED LESSONS */

    if (status === "completed") {

        card.appendChild(
            createReviewSection(booking)
        );
    }

    const rescheduleRequests =
        renderRescheduleRequests(booking);

    if (rescheduleRequests) {
        card.appendChild(rescheduleRequests);
    }

    if (
        status === "pending" ||
        status === "accepted"
    ) {

        const cancelButton =
            document.createElement("button");

        cancelButton.type = "button";

        cancelButton.className = "cancel-button";

        cancelButton.textContent = "Cancel Booking";

        cancelButton.addEventListener("click", () => {
            cancelBooking(booking, cancelButton);
        });

        card.appendChild(cancelButton);
    }

    const hasPendingRequest =
        currentRequests.some(request =>
            request.booking_id === booking.id &&
            request.status === "pending"
        );

    if (
        status === "accepted" &&
        !hasPendingRequest
    ) {
        card.appendChild(
            createRescheduleForm(booking)
        );
    }

    return card;
}

/* LOAD BOOKINGS AND REVIEWS */

async function loadBookings() {

    if (loading) return;

    loading = true;

    refreshBtn.disabled = true;

    refreshBtn.textContent = "Loading...";

    bookingsContainer.innerHTML =
        '<div class="notice">Loading your bookings...</div>';

    hideNotice();

    try {

        const {
            data: authData,
            error: authError
        } = await supabase.auth.getUser();

        if (authError) throw authError;

        if (!authData.user) {

            window.location.href = "student-login.html";

            return;
        }

        const user = authData.user;

        if (
            user.user_metadata?.account_type !== "student"
        ) {

            showNotice(
                "Please log in with your student account.",
                true
            );

            bookingsContainer.innerHTML = "";

            return;
        }

        const {
            data: bookings,
            error
        } = await supabase
            .from("lesson_bookings")
            .select("*")
            .eq("student_id", user.id)
            .order("created_at", {
                ascending: false
            });

        if (error) throw error;

        if (!bookings || bookings.length === 0) {

            bookingsContainer.innerHTML = `
                <div class="empty">
                    <h3>No lesson bookings yet</h3>
                    <p>
                        When you request a lesson with a tutor,
                        it will appear here.
                    </p>
                    <a href="find-tutors.html">
                        <button type="button">Find a Tutor</button>
                    </a>
                </div>
            `;

            return;
        }

        const tutorIds = [
            ...new Set(
                bookings.map(item => item.tutor_id)
            )
        ];

        const {
            data: tutors,
            error: tutorError
        } = await supabase
            .from("tutor_profiles")
            .select(`
                id,
                full_name,
                headline,
                profile_photo_url,
                teaching_languages,
                qualifications
            `)
            .in("id", tutorIds);

        if (tutorError) throw tutorError;

        const {
            data: requests,
            error: requestError
        } = await supabase.rpc(
            "get_my_reschedule_requests"
        );

        if (requestError) {
            throw requestError;
        }

        currentRequests = requests || [];

        /* LOAD EXISTING STUDENT REVIEWS */

        currentReviews = {};

        const bookingIds = bookings.map(
            booking => booking.id
        );

        const {
            data: reviews,
            error: reviewError
        } = await supabase
            .from("tutor_reviews")
            .select(`
                booking_id,
                rating,
                review_text,
                created_at
            `)
            .eq("student_id", user.id)
            .in("booking_id", bookingIds);

        if (reviewError) {
            throw reviewError;
        }

        (reviews || []).forEach(review => {
            currentReviews[review.booking_id] = review;
        });

        const tutorMap = {};

        (tutors || []).forEach(tutor => {
            tutorMap[tutor.id] = tutor;
        });

        bookingsContainer.innerHTML = "";

        bookings.forEach(booking => {

            const tutor =
                tutorMap[booking.tutor_id];

            bookingsContainer.appendChild(
                renderBooking(booking, tutor)
            );
        });

    } catch (error) {

        console.error(
            "Student bookings error:",
            error
        );

        bookingsContainer.innerHTML = "";

        showNotice(
            error.message ||
            "Unable to load your bookings. Please try again.",
            true
        );

    } finally {

        loading = false;

        refreshBtn.disabled = false;

        refreshBtn.textContent = "Refresh Bookings";
    }
}

refreshBtn.addEventListener(
    "click",
    loadBookings
);

loadBookings();

</script>
