<style>
* {

body {

.tutor-name {

.tutor-headline {

.details {

    margin: 18px 0;

.label {

    color: #82758e;

.value {
    font-weight: 600;

}

.status {
    display: inline-block;

.pending {

}

.accepted,
.approved {
    background: #dff7e8;
    color: #17643b;
}

.declined,

    background: #ffe2e2;

}

.completed {

    color: #51329b;

.message {

    padding: 13px;
    border-radius: 9px;

    background: #6d42a5;
    color: white;

    padding: 11px 17px;
    border-radius: 8px;

}

button:hover {
    background: #513078;
}

button:disabled {
    opacity: 0.6;

.cancel-button {

    margin-top: 16px;
}

.cancel-button:hover {

.reschedule-button {

    margin-right: 8px;
}

.reschedule-form {

    background: #f7f3fc;
    border: 1px solid #e7dbff;
    padding: 18px;
    border-radius: 12px;
    margin-top: 18px;
}

.reschedule-form h4 {
    margin-top: 0;
    color: #30164a;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8cde5;
    border-radius: 8px;
    font: inherit;
    color: #211038;
    background: white;
}

.form-group textarea {
    min-height: 85px;
    resize: vertical;
}

.form-help {
    color: #6c6079;
    font-size: 13px;
    line-height: 1.5;
}

.form-error {
    color: #b42318;
    font-size: 13px;
    margin-top: 10px;
}

.request-history {
    margin-top: 18px;
    padding: 15px;
    border: 1px solid #e7dbff;
    border-radius: 10px;
    background: #fcfaff;

.request-history h4 {
    margin: 0 0 12px;
}

.request-item {
    border-top: 1px solid #e7dbff;
    padding: 12px 0;
    line-height: 1.6;

.request-item:first-of-type {
    border-top: 0;
}

.request-item p {
    margin: 5px 0;
}

.empty,
.notice {
    background: white;
    padding: 28px;
    border-radius: 12px;
    text-align: center;

.error {
    color: #b42318;

@media(max-width: 600px) {

    }

function showNotice(text, isError = false) {
    notice.textContent = text;
    notice.style.display = "block";
    notice.className = isError
        ? "notice error"
        : "notice";
}


function hideNotice() {
    notice.style.display = "none";
}


function formatDate(value) {
    if (!value) return "Not specified";

    const date = new Date(value + "T00:00:00");

    return date.toLocaleDateString(undefined, {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}


function formatTime(value) {
    if (!value) return "Not specified";

    const parts = value.split(":");

    const date = new Date();

    date.setHours(
        Number(parts[0]),
        Number(parts[1]),
        0,
        0
    );

    return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}


function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}


function getInitials(name) {
    return String(name || "Tutor")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0).toUpperCase())
        .join("");
}


function createTutorPhoto(tutor) {

    const photo = document.createElement("img");

    photo.className = "tutor-photo";

    photo.alt = tutor?.full_name || "Tutor";

    photo.src = tutor?.profile_photo_url || "";

    photo.onerror = () => {
        const fallback = document.createElement("div");

        fallback.className = "tutor-photo";

        fallback.style.display = "flex";
        fallback.style.alignItems = "center";
        fallback.style.justifyContent = "center";
        fallback.style.fontWeight = "bold";
        fallback.style.color = "#513078";

        fallback.textContent = getInitials(tutor?.full_name);

        photo.replaceWith(fallback);
    };

    if (!tutor?.profile_photo_url) {
        photo.onerror();
    }

    return photo;
}


function createDetail(label, value) {

    const wrapper = document.createElement("div");

    const labelElement = document.createElement("div");
    labelElement.className = "label";
    labelElement.textContent = label;

    const valueElement = document.createElement("div");
    valueElement.className = "value";
    valueElement.textContent = value;

    wrapper.append(labelElement, valueElement);

    return wrapper;
}


function getRequestsForBooking(bookingId) {
    return rescheduleRequests.filter(
        request => request.booking_id === bookingId
    );
}


async function cancelBooking(booking, button) {

    const confirmed = window.confirm(
        "Are you sure you want to cancel this lesson booking?"
    );

    if (!confirmed) return;

    button.disabled = true;
    button.textContent = "Cancelling...";

    try {

        const {
            data,
            error
        } = await supabase.rpc(
            "student_cancel_booking",
            {
                booking_id: booking.id
            }
        );

        if (error) {
            throw error;
        }

        if (data !== true) {
            throw new Error(
                "The booking could not be cancelled. Please refresh and try again."
            );
        }

        await loadBookings();

        showNotice(
            "Your lesson booking has been cancelled successfully."
        );

    } catch (error) {

        console.error("Booking cancellation error:", error);

        showNotice(
            error.message || "Unable to cancel this booking. Please try again.",
            true
        );

        button.disabled = false;
        button.textContent = "Cancel Booking";

    }

}


function renderRequestHistory(booking) {

    const requests = getRequestsForBooking(booking.id);

    if (!requests.length) return null;

    const wrapper = document.createElement("div");
    wrapper.className = "request-history";

    const heading = document.createElement("h4");
    heading.textContent = "Rescheduling request history";

    wrapper.appendChild(heading);

    requests.forEach(request => {

        const item = document.createElement("div");
        item.className = "request-item";

        const status = String(request.status || "pending").toLowerCase();

        const allowed = [
            "pending",
            "approved",
            "declined",
            "cancelled"
        ];

        const safeStatus = allowed.includes(status)
            ? status
            : "pending";

        item.innerHTML = `
            <p><strong>Requested date:</strong>
            ${escapeHTML(formatDate(request.requested_date))}</p>

            <p><strong>Requested time:</strong>
            ${escapeHTML(formatTime(request.requested_start_time))}</p>

            <p><strong>Request status:</strong>
            <span class="status ${safeStatus}">
                ${safeStatus}
            </span></p>
        `;

        if (request.student_message) {
            const message = document.createElement("p");
            message.textContent =
                "Your reason: " + request.student_message;

            item.appendChild(message);
        }

        wrapper.appendChild(item);

    });

    return wrapper;
}
