<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | Tutor Pearl</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7f3fc;
    color: #211038;
}

header {
    background: #211038;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
}

header h2 {
    margin: 0;
}

header a {
    color: white;
    text-decoration: none;
    margin-left: 15px;
}

main {
    max-width: 1050px;
    margin: 35px auto;
    padding: 0 18px;
}

h1 {
    margin-bottom: 8px;
}

.intro {
    color: #6c6079;
    margin-bottom: 25px;
    line-height: 1.6;
}

.booking {
    background: white;
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px #21103812;
}

.booking h3 {
    margin-top: 0;
    color: #211038;
}

.tutor-profile {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 18px 0;
    padding: 15px;
    background: #f7f3fc;
    border-radius: 12px;
}

.tutor-photo {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    object-fit: cover;
    background: #e7dbff;
    flex-shrink: 0;
}

.tutor-info {
    min-width: 0;
}

.tutor-name {
    color: #6d42a5;
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 5px;
}

.tutor-headline {
    color: #6c6079;
    font-size: 14px;
    line-height: 1.5;
}

.details {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin: 18px 0;
}

.label {
    font-size: 12px;
    color: #82758e;
    margin-bottom: 5px;
}

.value {
    font-weight: 600;
    overflow-wrap: anywhere;
}

.status {
    display: inline-block;
    padding: 8px 13px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    text-transform: capitalize;
}

.pending {
    background: #fff2cf;
    color: #805600;
}

.accepted,
.approved {
    background: #dff7e8;
    color: #17643b;
}

.declined,
.cancelled {
    background: #ffe2e2;
    color: #a32626;
}

.completed {
    background: #e8e1ff;
    color: #51329b;
}

.message {
    background: #f7f3fc;
    padding: 13px;
    border-radius: 9px;
    margin-top: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

button {
    background: #6d42a5;
    color: white;
    border: 0;
    padding: 11px 17px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #513078;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.cancel-button {
    background: #b42318;
    margin-top: 16px;
}

.cancel-button:hover {
    background: #8f1b13;
}

.reschedule-button {
    margin-top: 16px;
    margin-right: 8px;
}

.reschedule-form {
    display: none;
    background: #f7f3fc;
    border: 1px solid #e7dbff;
    padding: 18px;
    border-radius: 12px;
    margin-top: 18px;
}

.reschedule-form h4 {
    margin-top: 0;
    color: #30164a;
}

.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d8cde5;
    border-radius: 8px;
    font: inherit;
    color: #211038;
    background: white;
}

.form-group textarea {
    min-height: 85px;
    resize: vertical;
}

.form-help {
    color: #6c6079;
    font-size: 13px;
    line-height: 1.5;
}

.form-error {
    color: #b42318;
    font-size: 13px;
    margin-top: 10px;
}

.request-history {
    margin-top: 18px;
    padding: 15px;
    border: 1px solid #e7dbff;
    border-radius: 10px;
    background: #fcfaff;
}

.request-history h4 {
    margin: 0 0 12px;
}

.request-item {
    border-top: 1px solid #e7dbff;
    padding: 12px 0;
    line-height: 1.6;
}

.request-item:first-of-type {
    border-top: 0;
}

.request-item p {
    margin: 5px 0;
}

.empty,
.notice {
    background: white;
    padding: 28px;
    border-radius: 12px;
    text-align: center;
}

.error {
    color: #b42318;
}

@media(max-width: 600px) {
    header {
        padding: 18px;
    }

    header a {
        margin-left: 8px;
    }

    main {
        margin: 25px auto;
    }

    .tutor-photo {
        width: 65px;
        height: 65px;
    }
}
</style>
</head>

<body>

<header>
    <h2>Tutor Pearl</h2>

    <nav>
        <a href="student-dashboard.html">Dashboard</a>
        <a href="find-tutors.html">Find Tutors</a>
    </nav>
</header>

<main>

    <h1>My Lesson Bookings</h1>

    <p class="intro">
        View your lesson requests, meet your tutors and check the latest status of your bookings.
    </p>

    <button id="refreshBtn">Refresh Bookings</button>

    <p id="notice" class="notice" style="display:none"></p>

    <div id="bookings" style="margin-top:22px">
        <div class="notice">Loading your bookings...</div>
    </div>

</main>

<script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
"https://chmdsvfmlscrbqomqifp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const bookingsContainer =
document.getElementById("bookings");

const notice =
document.getElementById("notice");

const refreshBtn =
document.getElementById("refreshBtn");

let loading = false;
let rescheduleRequests = [];

function showNotice(text, isError = false) {
    notice.textContent = text;
    notice.style.display = "block";
    notice.className = isError ? "notice error" : "notice";
}

function hideNotice() {
    notice.style.display = "none";
}

function formatDate(value) {
    if (!value) return "Not specified";

    const date = new Date(value + "T00:00:00");

    return date.toLocaleDateString(undefined, {
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function formatTime(value) {
    if (!value) return "Not specified";

    const parts = value.split(":");
    const date = new Date();

    date.setHours(Number(parts[0]), Number(parts[1]), 0, 0);

    return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function getInitials(name) {
    return String(name || "Tutor")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map(part => part.charAt(0).toUpperCase())
        .join("");
}

function createTutorPhoto(tutor) {
    const photo = document.createElement("img");

    photo.className = "tutor-photo";
    photo.alt = tutor?.full_name || "Tutor";

    if (tutor?.profile_photo_url) {
        photo.src = tutor.profile_photo_url;

        photo.onerror = () => {
            const fallback = document.createElement("div");
            fallback.className = "tutor-photo";
            fallback.style.display = "flex";
            fallback.style.alignItems = "center";
            fallback.style.justifyContent = "center";
            fallback.style.fontWeight = "bold";
            fallback.style.color = "#513078";
            fallback.textContent = getInitials(tutor?.full_name);
            photo.replaceWith(fallback);
        };
    } else {
        photo.style.display = "none";

        const fallback = document.createElement("div");
        fallback.className = "tutor-photo";
        fallback.style.display = "flex";
        fallback.style.alignItems = "center";
        fallback.style.justifyContent = "center";
        fallback.style.fontWeight = "bold";
        fallback.style.color = "#513078";
        fallback.textContent = getInitials(tutor?.full_name);

        return fallback;
    }

    return photo;
}

function createDetail(label, value) {
    const wrapper = document.createElement("div");

    const labelElement = document.createElement("div");
    labelElement.className = "label";
    labelElement.textContent = label;

    const valueElement = document.createElement("div");
    valueElement.className = "value";
    valueElement.textContent = value;

    wrapper.append(labelElement, valueElement);

    return wrapper;
}

function getRequestsForBooking(bookingId) {
    return rescheduleRequests.filter(
        request => request.booking_id === bookingId
    );
}

async function cancelBooking(booking, button) {
    if (!window.confirm(
        "Are you sure you want to cancel this lesson booking?"
    )) return;

    button.disabled = true;
    button.textContent = "Cancelling...";

    try {
        const { data, error } = await supabase.rpc(
            "student_cancel_booking",
            { booking_id: booking.id }
        );

        if (error) throw error;

        if (data !== true) {
            throw new Error("The booking could not be cancelled.");
        }

        await loadBookings();

        showNotice(
            "Your lesson booking has been cancelled successfully."
        );

    } catch (error) {
        console.error("Booking cancellation error:", error);

        showNotice(
            error.message || "Unable to cancel this booking.",
            true
        );

        button.disabled = false;
        button.textContent = "Cancel Booking";
    }
}

function renderRequestHistory(booking) {
    const requests = getRequestsForBooking(booking.id);

    if (!requests.length) return null;

    const wrapper = document.createElement("div");
    wrapper.className = "request-history";

    const heading = document.createElement("h4");
    heading.textContent = "Rescheduling request history";

    wrapper.appendChild(heading);

    requests.forEach(request => {
        const item = document.createElement("div");
        item.className = "request-item";

        const status = String(
            request.status || "pending"
        ).toLowerCase();

        const allowed = [
            "pending",
            "approved",
            "declined",
            "cancelled"
        ];

        const safeStatus = allowed.includes(status)
            ? status
            : "pending";

        const dateLine = document.createElement("p");
        dateLine.textContent =
            "Requested date: " + formatDate(request.requested_date);

        const timeLine = document.createElement("p");
        timeLine.textContent =
            "Requested time: " + formatTime(request.requested_start_time);

        const statusLine = document.createElement("p");
        statusLine.textContent = "Request status: ";

        const badge = document.createElement("span");
        badge.className = "status " + safeStatus;
        badge.textContent = safeStatus;

        statusLine.appendChild(badge);

        item.append(dateLine, timeLine, statusLine);

        if (request.student_message) {
            const message = document.createElement("p");
            message.textContent =
                "Your reason: " + request.student_message;
            item.appendChild(message);
        }

        wrapper.appendChild(item);
    });

    return wrapper;
}

function createRescheduleForm(booking, button) {
    const form = document.createElement("form");
    form.className = "reschedule-form";

    const title = document.createElement("h4");
    title.textContent = "Request a lesson reschedule";

    const explanation = document.createElement("p");
    explanation.className = "form-help";
    explanation.textContent =
        "Choose your preferred new date and time. Your tutor must approve the request before the booking changes.";

    const dateGroup = document.createElement("div");
    dateGroup.className = "form-group";

    const dateLabel = document.createElement("label");
    dateLabel.textContent = "New lesson date";

    const dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.required = true;

    const now = new Date();

    dateInput.min = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
    ].join("-");

    dateGroup.append(dateLabel, dateInput);

    const timeGroup = document.createElement("div");
    timeGroup.className = "form-group";

    const timeLabel = document.createElement("label");
    timeLabel.textContent = "New lesson start time";

    const timeInput = document.createElement("input");
    timeInput.type = "time";
    timeInput.required = true;

    timeGroup.append(timeLabel, timeInput);

    const messageGroup = document.createElement("div");
    messageGroup.className = "form-group";

    const messageLabel = document.createElement("label");
    messageLabel.textContent = "Message to your tutor (optional)";

    const messageInput = document.createElement("textarea");
    messageInput.maxLength = 1000;
    messageInput.placeholder =
        "Let your tutor know why you need to reschedule.";

    messageGroup.append(messageLabel, messageInput);

    const help = document.createElement("p");
    help.className = "form-help";
    help.textContent =
        "The tutor will check availability and other bookings before approving your request.";

    const errorText = document.createElement("p");
    errorText.className = "form-error";
    errorText.style.display = "none";

    const submit = document.createElement("button");
    submit.type = "submit";
    submit.textContent = "Send Reschedule Request";

    const close = document.createElement("button");
    close.type = "button";
    close.textContent = "Close";
    close.style.marginLeft = "8px";
    close.style.background = "#82758e";

    close.addEventListener("click", () => {
        form.style.display = "none";
        button.textContent = "Reschedule Lesson";
    });

    form.append(
        title,
        explanation,
        dateGroup,
        timeGroup,
        messageGroup,
        help,
        errorText,
        submit,
        close
    );

    form.addEventListener("submit", async event => {
        event.preventDefault();

        errorText.style.display = "none";

        if (!dateInput.value || !timeInput.value) {
            errorText.textContent =
                "Please choose both a date and a time.";
            errorText.style.display = "block";
            return;
        }

        if (
            dateInput.value === booking.lesson_date &&
            timeInput.value === booking.start_time.slice(0, 5)
        ) {
            errorText.textContent =
                "Please choose a different date or time.";
            errorText.style.display = "block";
            return;
        }

        submit.disabled = true;
        submit.textContent = "Sending request...";

        try {
            const { data, error } = await supabase.rpc(
                "student_request_reschedule",
                {
                    p_booking_id: booking.id,
                    p_requested_date: dateInput.value,
                    p_requested_start_time: timeInput.value,
                    p_student_message: messageInput.value.trim() || null
                }
            );

            if (error) throw error;

            if (!data) {
                throw new Error(
                    "Your rescheduling request could not be submitted."
                );
            }

            await loadBookings();

            showNotice(
                "Your rescheduling request has been sent to your tutor. Your original booking remains unchanged until the tutor approves it."
            );

        } catch (error) {
            console.error("Rescheduling request error:", error);

            errorText.textContent =
                error.message ||
                "Unable to send your request. Please try again.";

            errorText.style.display = "block";

            submit.disabled = false;
            submit.textContent = "Send Reschedule Request";
        }
    });

    return form;
}

function renderBooking(booking, tutor) {
    const card = document.createElement("section");
    card.className = "booking";

    const subject = document.createElement("h3");
    subject.textContent = booking.subject || "Lesson request";

    const profile = document.createElement("div");
    profile.className = "tutor-profile";

    profile.appendChild(createTutorPhoto(tutor));

    const info = document.createElement("div");
    info.className = "tutor-info";

    const name = document.createElement("div");
    name.className = "tutor-name";
    name.textContent = tutor?.full_name || "Tutor";

    const headline = document.createElement("div");
    headline.className = "tutor-headline";
    headline.textContent =
        tutor?.headline || "Tutor Pearl tutor";

    info.append(name, headline);
    profile.appendChild(info);

    const details = document.createElement("div");
    details.className = "details";

    const languages = Array.isArray(tutor?.teaching_language)
        ? tutor.teaching_language.join(", ")
        : (tutor?.teaching_language || "Not specified");

    details.append(
        createDetail("Teaching languages", languages),
        createDetail(
            "Qualifications",
            tutor?.qualification || "Not provided"
        ),
        createDetail("Lesson date", formatDate(booking.lesson_date)),
        createDetail("Start time", formatTime(booking.start_time)),
        createDetail("Duration", booking.duration_minutes + " minutes")
    );

    const statusWrapper = document.createElement("div");

    const statusLabel = document.createElement("div");
    statusLabel.className = "label";
    statusLabel.textContent = "Booking status";

    const allowedStatuses = [
        "pending",
        "accepted",
        "declined",
        "cancelled",
        "completed"
    ];

    const bookingStatus = String(
        booking.status || "pending"
    ).toLowerCase();

    const safeStatus = allowedStatuses.includes(bookingStatus)
        ? bookingStatus
        : "pending";

    const status = document.createElement("span");
    status.className = "status " + safeStatus;
    status.textContent = safeStatus;

    statusWrapper.append(statusLabel, status);
    details.appendChild(statusWrapper);

    card.append(subject, profile, details);

    if (booking.student_message) {
        const message = document.createElement("div");
        message.className = "message";

        const strong = document.createElement("strong");
        strong.textContent = "Your message:";

        const text = document.createElement("div");
        text.textContent = booking.student_message;

        message.append(strong, text);
        card.appendChild(message);
    }

    const requests = getRequestsForBooking(booking.id);

    const hasPendingRequest = requests.some(
        request => request.status === "pending"
    );

    if (safeStatus === "accepted") {
        if (!hasPendingRequest) {
            const rescheduleButton = document.createElement("button");

            rescheduleButton.type = "button";
            rescheduleButton.className = "reschedule-button";
            rescheduleButton.textContent = "Reschedule Lesson";

            const form = createRescheduleForm(
                booking,
                rescheduleButton
            );

            rescheduleButton.addEventListener("click", () => {
                const visible = form.style.display === "block";

                form.style.display = visible ? "none" : "block";

                rescheduleButton.textContent = visible
                    ? "Reschedule Lesson"
                    : "Close Reschedule Form";
            });

            card.append(rescheduleButton, form);

        } else {
            const pendingMessage = document.createElement("div");
            pendingMessage.className = "message";
            pendingMessage.textContent =
                "You have a pending rescheduling request for this lesson. Please wait for your tutor to respond.";

            card.appendChild(pendingMessage);
        }
    }

    const history = renderRequestHistory(booking);

    if (history) {
        card.appendChild(history);
    }

    if (
        safeStatus === "pending" ||
        safeStatus === "accepted"
    ) {
        const cancelButton = document.createElement("button");

        cancelButton.type = "button";
        cancelButton.className = "cancel-button";
        cancelButton.textContent = "Cancel Booking";

        cancelButton.addEventListener("click", () => {
            cancelBooking(booking, cancelButton);
        });

        card.appendChild(cancelButton);
    }

    return card;
}

async function loadBookings() {
    if (loading) return;

    loading = true;

    refreshBtn.disabled = true;
    refreshBtn.textContent = "Loading...";

    bookingsContainer.innerHTML =
        '<div class="notice">Loading your bookings...</div>';

    hideNotice();

    try {
        const { data: authData, error: authError } =
            await supabase.auth.getUser();

        if (authError) throw authError;

        if (!authData.user) {
            window.location.href = "student-login.html";
            return;
        }

        const user = authData.user;

        if (user.user_metadata?.account_type !== "student") {
            showNotice(
                "Please log in with your student account.",
                true
            );

            bookingsContainer.innerHTML = "";
            return;
        }

        const { data: bookings, error } = await supabase
            .from("lesson_bookings")
            .select("*")
            .eq("student_id", user.id)
            .order("created_at", { ascending: false });

        if (error) throw error;

        const { data: requests, error: requestError } =
            await supabase.rpc("get_my_reschedule_requests");

        if (requestError) throw requestError;

        rescheduleRequests = requests || [];

        if (!bookings || bookings.length === 0) {
            bookingsContainer.innerHTML = `
                <div class="empty">
                    <h3>No lesson bookings yet</h3>
                    <p>
                        When you request a lesson with a tutor,
                        it will appear here.
                    </p>
                    <a href="find-tutors.html">
                        <button type="button">Find a Tutor</button>
                    </a>
                </div>
            `;
            return;
        }

        const tutorIds = [
            ...new Set(bookings.map(item => item.tutor_id))
        ];

        const { data: tutors, error: tutorError } =
            await supabase
                .from("tutor_profiles")
                .select(`
                    id,
                    full_name,
                    headline,
                    profile_photo_url,
                    teaching_language,
                    qualification
                `)
                .in("id", tutorIds);

        if (tutorError) throw tutorError;

        const tutorMap = {};

        (tutors || []).forEach(tutor => {
            tutorMap[tutor.id] = tutor;
        });

        bookingsContainer.innerHTML = "";

        bookings.forEach(booking => {
            const tutor = tutorMap[booking.tutor_id];

            bookingsContainer.appendChild(
                renderBooking(booking, tutor)
            );
        });

    } catch (error) {
        console.error("Student bookings error:", error);

        bookingsContainer.innerHTML = "";

        showNotice(
            error.message ||
            "Unable to load your bookings. Please try again.",
            true
        );

    } finally {
        loading = false;
        refreshBtn.disabled = false;
        refreshBtn.textContent = "Refresh Bookings";
    }
}

refreshBtn.addEventListener("click", loadBookings);

loadBookings();

</script>

</body>
</html>
