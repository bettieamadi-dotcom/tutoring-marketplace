<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tutor Login | Tutor Pearl</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 25px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #211038;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 35px 28px;
      background: #30164A;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      color: #E7DBFF;
      margin-bottom: 25px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #D8CDE5;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #C8A8FF;
      border-radius: 8px;
      font-size: 15px;
      color: #211038;
      background: white;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 65px;
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #30164A;
      cursor: pointer;
      font-weight: bold;
    }

    .forgot {
      display: block;
      text-align: right;
      margin-top: 12px;
      color: #E7DBFF;
      font-size: 14px;
      text-decoration: none;
    }

    .login-button {
      width: 100%;
      padding: 15px;
      margin-top: 25px;
      border: none;
      border-radius: 8px;
      background: #C8A8FF;
      color: #211038;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .signup {
      margin-top: 25px;
      text-align: center;
      color: #D8CDE5;
      line-height: 1.8;
    }

    a {
      color: #E7DBFF;
    }

    .home {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
  </style></head><body>  <div class="container"><div class="logo">Tutor Pearl</div>

<h1>Welcome Back, Tutor!</h1>

<p class="intro">
  Log in to access your teaching account and continue
  your journey with Tutor Pearl.
</p>

<form id="loginForm">

  <label for="email">Email Address</label>
  <input
    type="email"
    id="email"
    placeholder="Enter your email address"
    autocomplete="email"
    required
  >

  <label for="password">Password</label>

  <div class="password-box">
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button
      type="button"
      class="toggle"
      id="togglePassword"
    >
      Show
    </button>
  </div>

  <a class="forgot" href="reset-password.html">
    Forgot password?
  </a>

  <button
    type="submit"
    class="login-button"
    id="loginButton"
  >
    Log In
  </button>

</form>

<div id="message" role="status" aria-live="polite"></div>

<div class="signup">
  Don't have a tutor account?
  <a href="tutor-signup.html">Become a Tutor</a>
</div>

<a class="home" href="index.html">
  Back to Homepage
</a>

  </div>  <script type="module">

    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://chmdsvfmlscrbqomqifp.supabase.co',
      'sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ'
    );

    const form = document.getElementById('loginForm');
    const message = document.getElementById('message');
    const loginButton = document.getElementById('loginButton');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';

      passwordInput.type = isHidden ? 'text' : 'password';
      togglePassword.textContent = isHidden ? 'Hide' : 'Show';
    });

    form.addEventListener('submit', async (event) => {

      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = 'Logging in...';
      message.textContent = '';

      const email = document.getElementById('email')
        .value.trim();

      const password = passwordInput.value;

      try {

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error('Unable to verify your account. Please try again.');
        }

        if (data.user.user_metadata?.account_type !== 'tutor') {

          await supabase.auth.signOut();

          throw new Error(
            'This login page is for tutor accounts only. Please use the student login page.'
          );

        }

        window.location.href = 'tutor-dashboard.html';

      } catch (error) {

        console.error('Tutor login error:', error);

        message.textContent =
          error.message || 'Login failed. Please check your details.';

        loginButton.disabled = false;
        loginButton.textContent = 'Log In';

      }

    });

  </script></body>
  </html>
