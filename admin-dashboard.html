<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Pearl | Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#211038;color:white}
header{padding:20px;background:#30164A;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;color:#C8A8FF;font-size:22px}
main{max-width:1000px;margin:30px auto;padding:16px}
.panel,.tutor-card{background:#3B2058;padding:22px;border-radius:13px;margin-bottom:20px}
h2,h3{color:#C8A8FF}
input{width:100%;padding:14px;margin:9px 0;border:0;border-radius:7px;font-size:16px}
button{padding:12px 16px;border:0;border-radius:7px;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}
button:disabled{opacity:.5;cursor:not-allowed}
.primary{background:#C8A8FF;color:#211038}
.approve{background:#24A36A;color:white}
.reject{background:#D94C61;color:white}
.logout{background:white;color:#211038}
.review{background:#E7DBFF;color:#211038}
.message{line-height:1.5;overflow-wrap:anywhere}
.muted{color:#D8CDE5}
.tutor-card{background:#211038;border:1px solid #65458A}
.tutor-card img,.profile-photo{width:100px;height:100px;object-fit:cover;border-radius:50%}
.tutor-card p,.detail p{line-height:1.6;overflow-wrap:anywhere}
[hidden]{display:none!important}
.modal{position:fixed;inset:0;background:#10091bdc;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}
.modal-content{background:#3B2058;width:100%;max-width:650px;max-height:90vh;overflow-y:auto;padding:22px;border-radius:14px}
.close{float:right;background:white;color:#211038}
.detail{border-bottom:1px solid #65458A;padding:8px 0}
.detail strong{color:#C8A8FF}
video{width:100%;max-height:350px;background:#10091b;border-radius:10px}
</style>
</head>
<body><header>
<h1>Tutor Pearl Admin</h1>
<button id="logoutBtn" class="logout" hidden>Log Out</button>
</header><main>
<section id="loginPanel" class="panel">
<h2>Administrator Login</h2>
<p class="muted">Sign in with your administrator account.</p>
<form id="loginForm">
<input type="email" id="email" placeholder="Administrator email" autocomplete="username" required>
<input type="password" id="password" placeholder="Password" autocomplete="current-password" required>
<button class="primary" type="submit">Sign In</button>
</form>
<p id="loginMessage" class="message"></p>
</section><section id="dashboardPanel" hidden>
<div class="panel">
<h2>Welcome, Administrator</h2>
<p class="muted">Review applications before tutors appear publicly on Tutor Pearl.</p>
<button id="refreshBtn" class="primary">Refresh Applications</button>
<p id="dashboardMessage" class="message"></p>
</div><div class="panel">
<h2>Pending Tutor Applications</h2>
<div id="tutorList"></div>
</div>
</section>
</main><div id="reviewModal" class="modal" hidden>
<div class="modal-content">
<button id="closeModal" class="close">Close</button>
<div id="applicationDetails"></div>
</div>
</div><script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const supabase=createClient(
"https://chmdsvfmlscrbqomqifp.supabase.co",
"sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ"
);

const loginPanel=document.getElementById("loginPanel");
const dashboardPanel=document.getElementById("dashboardPanel");
const loginForm=document.getElementById("loginForm");
const loginMessage=document.getElementById("loginMessage");
const dashboardMessage=document.getElementById("dashboardMessage");
const tutorList=document.getElementById("tutorList");
const logoutBtn=document.getElementById("logoutBtn");
const modal=document.getElementById("reviewModal");
const details=document.getElementById("applicationDetails");

let pendingTutors=[];

function showLogin(message=""){
loginPanel.hidden=false;
dashboardPanel.hidden=true;
logoutBtn.hidden=true;
loginMessage.textContent=message;
}

function addText(parent,tag,text,className=""){
const el=document.createElement(tag);
el.textContent=text || "Not provided";
if(className)el.className=className;
parent.appendChild(el);
return el;
}

async function showDashboard(){
const {data:access,error}=await supabase.rpc("admin_check_access");
if(error || access!==true){
await supabase.auth.signOut();
showLogin("This account does not have administrator access.");
return;
}
loginPanel.hidden=true;
dashboardPanel.hidden=false;
logoutBtn.hidden=false;
await loadTutors();
}

async function loadTutors(){
tutorList.replaceChildren();
dashboardMessage.textContent="Loading applications...";

const {data,error}=await supabase.rpc("admin_get_pending_tutors");

if(error){
dashboardMessage.textContent="Could not load applications: "+error.message;
return;
}

pendingTutors=data || [];
dashboardMessage.textContent=pendingTutors.length+" pending application(s) found.";

if(!pendingTutors.length){
addText(tutorList,"p","There are currently no pending tutor applications.","muted");
return;
}

pendingTutors.forEach(tutor=>{
const card=document.createElement("article");
card.className="tutor-card";

if(tutor.profile_photo_url){
const photo=document.createElement("img");
photo.src=tutor.profile_photo_url;
photo.alt="Tutor profile photo";
photo.onerror=()=>photo.remove();
card.appendChild(photo);
}

addText(card,"h3",tutor.full_name);
addText(card,"p",tutor.headline);
addText(card,"p","Subjects: "+(tutor.subjects || "Not provided"));
addText(card,"p","Hourly rate: "+(tutor.currency || "USD")+" "+(tutor.hourly_rate ?? "Not provided"));

const view=document.createElement("button");
view.className="review";
view.textContent="View Full Application";
view.addEventListener("click",()=>openApplication(tutor));

const approve=document.createElement("button");
approve.className="approve";
approve.textContent="Approve";
approve.addEventListener("click",()=>reviewTutor(tutor.id,"approved",approve,reject));

const reject=document.createElement("button");
reject.className="reject";
reject.textContent="Reject";
reject.addEventListener("click",()=>reviewTutor(tutor.id,"rejected",approve,reject));

card.append(view,approve,reject);
tutorList.appendChild(card);
});
}

function openApplication(tutor){
details.replaceChildren();

addText(details,"h2","Tutor Application Review");

if(tutor.profile_photo_url){
const photo=document.createElement("img");
photo.src=tutor.profile_photo_url;
photo.alt="Tutor profile photograph";
photo.className="profile-photo";
details.appendChild(photo);
}

const fields=[
["Full name",tutor.full_name],
["Professional headline",tutor.headline],
["Subjects",tutor.subjects],
["Teaching languages",tutor.teaching_languages],
["Qualifications",tutor.qualifications],
["Hourly rate",(tutor.currency || "USD")+" "+(tutor.hourly_rate ?? "Not provided")],
["Biography",tutor.biography],
["Application status",tutor.approval_status]
];

fields.forEach(([label,value])=>{
const row=document.createElement("div");
row.className="detail";
const strong=document.createElement("strong");
strong.textContent=label;
row.appendChild(strong);
addText(row,"p",value);
details.appendChild(row);
});

addText(details,"h3","Introduction Video");

const videoUrl=
tutor.intro_video_url ||
tutor.introduction_video_url ||
tutor.video_intro_url ||
tutor.profile_video_url ||
"";

if(videoUrl){
const video=document.createElement("video");
video.controls=true;
video.preload="metadata";
video.src=videoUrl;
details.appendChild(video);
}else{
addText(details,"p","No introduction video has been submitted or connected yet.","muted");
}

modal.hidden=false;
}

async function reviewTutor(id,decision,approveBtn,rejectBtn){
const action=decision==="approved"?"approve":"reject";

if(!confirm("Are you sure you want to "+action+" this tutor?"))return;

approveBtn.disabled=true;
rejectBtn.disabled=true;

const {data,error}=await supabase.rpc("admin_review_tutor",{
tutor_id:id,
decision:decision
});

if(error){
alert("Review failed: "+error.message);
approveBtn.disabled=false;
rejectBtn.disabled=false;
return;
}

if(data!==true){
alert("This application was already reviewed or could not be found.");
}else{
alert("Tutor application "+decision+".");
modal.hidden=true;
}

await loadTutors();
}

loginForm.addEventListener("submit",async event=>{
event.preventDefault();
loginMessage.textContent="Signing in...";

const {error}=await supabase.auth.signInWithPassword({
email:document.getElementById("email").value.trim(),
password:document.getElementById("password").value
});

if(error){
loginMessage.textContent=error.message;
return;
}

await showDashboard();
});

logoutBtn.addEventListener("click",async()=>{
await supabase.auth.signOut();
showLogin("You have signed out.");
});

document.getElementById("refreshBtn").addEventListener("click",loadTutors);
document.getElementById("closeModal").addEventListener("click",()=>{
modal.hidden=true;
});

modal.addEventListener("click",event=>{
if(event.target===modal)modal.hidden=true;
});

const {data:{session}}=await supabase.auth.getSession();
if(session)await showDashboard();
else showLogin();
</script></body>
</html>
