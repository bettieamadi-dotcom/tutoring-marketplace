<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Tutors | Tutor Pearl</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #211038;
      color: #fff;
    }

    header {
      background: #30164A;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      color: #C8A8FF;
      font-size: 25px;
      font-weight: bold;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    nav a {
      color: #E7DBFF;
      text-decoration: none;
      font-size: 14px;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 45px;
      background: #30164A;
    }

    .hero h1 {
      color: #E7DBFF;
      font-size: 36px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #D8CDE5;
      line-height: 1.7;
      max-width: 600px;
      margin: auto;
    }

    .container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .search-area {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .search-area input {
      flex: 1;
      min-width: 200px;
      padding: 14px;
      border: 1px solid #765B91;
      border-radius: 8px;
      background: #3B2058;
      color: white;
      font-size: 15px;
    }

    .search-area input::placeholder {
      color: #D8CDE5;
    }

    .search-area button {
      padding: 14px 22px;
      border: none;
      border-radius: 8px;
      background: #C8A8FF;
      color: #211038;
      font-weight: bold;
      cursor: pointer;
    }

    .section-title {
      color: #E7DBFF;
      margin-bottom: 20px;
    }

    .tutor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 24px;
    }

    .tutor-card {
      background: #3B2058;
      border-radius: 15px;
      padding: 22px;
      overflow: hidden;
    }

    .tutor-photo {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #C8A8FF;
      display: block;
      margin: 0 auto 18px;
      background: #211038;
    }

    .tutor-name {
      color: #E7DBFF;
      text-align: center;
      margin: 0 0 8px;
      font-size: 21px;
    }

    .headline {
      text-align: center;
      color: #C8A8FF;
      line-height: 1.5;
      min-height: 42px;
    }

    .tutor-info {
      color: #D8CDE5;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .rate {
      color: #C8A8FF;
      font-size: 19px;
      font-weight: bold;
      margin-top: 15px;
    }

    .empty-state {
      background: #3B2058;
      padding: 35px 20px;
      text-align: center;
      border-radius: 12px;
      color: #D8CDE5;
      line-height: 1.7;
    }

    .error {
      color: #FFAAAA;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #D8CDE5;
      font-size: 13px;
      margin-top: 50px;
    }

    @media (max-width: 600px) {
      .hero h1 {
        font-size: 28px;
      }

      header {
        padding: 18px;
      }
    }
  </style></head><body><header>
  <a href="index.html" class="logo">Tutor Pearl</a>  <nav>
    <a href="index.html">Home</a>
    <a href="student-dashboard.html">Student Dashboard</a>
    <a href="tutor-login.html">Tutor Login</a>
  </nav>
</header><section class="hero">
  <h1>Find Your Perfect Tutor</h1>  <p>
    Discover qualified tutors, explore different subjects and find
    the right learning support for your goals.
  </p>
</section><main class="container">  <div class="search-area">
    <input
      type="search"
      id="searchInput"
      placeholder="Search by tutor name, subject or language..."
    ><button type="button" id="searchButton">Search</button>

  </div>  <h2 class="section-title">Explore Our Tutors</h2>  <div id="statusMessage" class="empty-state">
    Loading approved tutors...
  </div>  <div id="tutorGrid" class="tutor-grid"></div></main><footer>
  © 2026 Tutor Pearl. All rights reserved.
</footer><script type="module">
  import { createClient } from
    'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL =
    'https://chmdsvfmlscrbqomqifp.supabase.co';

  const SUPABASE_KEY =
    'sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  const tutorGrid = document.getElementById('tutorGrid');
  const statusMessage = document.getElementById('statusMessage');
  const searchInput = document.getElementById('searchInput');
  const searchButton = document.getElementById('searchButton');

  let allTutors = [];

  function createTextElement(tag, className, text) {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    return element;
  }

  function displayTutors(tutors) {
    tutorGrid.replaceChildren();

    if (!tutors.length) {
      statusMessage.style.display = 'block';
      statusMessage.textContent =
        'No approved tutors match your search. Try another name, subject or language.';
      return;
    }

    statusMessage.style.display = 'none';

    tutors.forEach(tutor => {
      const card = document.createElement('article');
      card.className = 'tutor-card';

      const photo = document.createElement('img');
      photo.className = 'tutor-photo';
      photo.alt = 'Tutor profile photograph';

      if (tutor.profile_photo_url) {
        photo.src = tutor.profile_photo_url;
      } else {
        photo.src =
          'https://placehold.co/300x300/30164A/C8A8FF?text=Tutor';
      }

      photo.onerror = () => {
        photo.src =
          'https://placehold.co/300x300/30164A/C8A8FF?text=Tutor';
      };

      const name = createTextElement(
        'h3',
        'tutor-name',
        tutor.full_name || 'Tutor'
      );

      const headline = createTextElement(
        'p',
        'headline',
        tutor.headline || 'Tutor on Tutor Pearl'
      );

      const info = document.createElement('div');
      info.className = 'tutor-info';

      const subjects = Array.isArray(tutor.subjects)
        ? tutor.subjects.join(', ')
        : 'Not specified';

      const languages = Array.isArray(tutor.teaching_languages)
        ? tutor.teaching_languages.join(', ')
        : 'Not specified';

      const qualifications =
        tutor.qualifications || 'Not provided';

      const biography =
        tutor.biography || 'This tutor has not added a biography yet.';

      const rate = tutor.hourly_rate !== null &&
        tutor.hourly_rate !== undefined
        ? Number(tutor.hourly_rate).toLocaleString()
        : 'Contact tutor';

      const currency = tutor.currency || 'USD';

      [
        ['Subjects', subjects],
        ['Teaching languages', languages],
        ['Qualifications', qualifications],
        ['About the tutor', biography]
      ].forEach(([label, value]) => {
        const paragraph = document.createElement('p');
        const strong = document.createElement('strong');

        strong.textContent = label + ': ';
        paragraph.appendChild(strong);
        paragraph.appendChild(document.createTextNode(value));

        info.appendChild(paragraph);
      });

      const rateElement = createTextElement(
        'p',
        'rate',
        rate === 'Contact tutor'
          ? rate
          : currency + ' ' + rate + ' / hour'
      );

      card.append(photo, name, headline, info, rateElement);
      tutorGrid.appendChild(card);
    });
  }

  async function loadTutors() {
    statusMessage.style.display = 'block';
    statusMessage.textContent = 'Loading approved tutors...';

    const { data, error } = await supabase
      .from('tutor_profiles')
      .select(`
        full_name,
        headline,
        subjects,
        hourly_rate,
        currency,
        teaching_languages,
        qualifications,
        biography,
        profile_photo_url
      `)
      .eq('approval_status', 'approved');

    if (error) {
      statusMessage.textContent =
        'We could not load tutors. Please try again later.';

      statusMessage.className = 'empty-state error';
      console.error('Tutor loading error:', error);
      return;
    }

    allTutors = data || [];

    displayTutors(allTutors);
  }

  function searchTutors() {
    const searchTerm = searchInput.value.trim().toLowerCase();

    if (!searchTerm) {
      displayTutors(allTutors);
      return;
    }

    const filteredTutors = allTutors.filter(tutor => {
      const searchableText = [
        tutor.full_name,
        tutor.headline,
        tutor.biography,
        tutor.qualifications,
        ...(Array.isArray(tutor.subjects) ? tutor.subjects : []),
        ...(Array.isArray(tutor.teaching_languages)
          ? tutor.teaching_languages
          : [])
      ].join(' ').toLowerCase();

      return searchableText.includes(searchTerm);
    });

    displayTutors(filteredTutors);
  }

  searchButton.addEventListener('click', searchTutors);

  searchInput.addEventListener('input', searchTutors);

  loadTutors();
</script></body>
</html>
