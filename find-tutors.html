<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Tutors | Tutor Pearl</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #211038;
    color: #fff;
}

header {
    background: #30164A;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

header h2 {
    margin: 0;
    color: #E7DBFF;
}

nav a {
    color: #D8CDE5;
    text-decoration: none;
    margin: 0 8px;
}

nav a:hover {
    color: #C8A8FF;
}

.container {
    max-width: 1150px;
    margin: 35px auto;
    padding: 0 18px;
}

h1 {
    color: #E7DBFF;
}

.intro {
    color: #D8CDE5;
    line-height: 1.6;
}

.search-box {
    display: flex;
    gap: 10px;
    margin: 25px 0;
    flex-wrap: wrap;
}

input {
    flex: 1;
    min-width: 220px;
    padding: 14px;
    border-radius: 8px;
    border: 1px solid #80649c;
    background: #30164A;
    color: white;
    font-size: 15px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 13px 20px;
    cursor: pointer;
    font-weight: bold;
}

.search-btn {
    background: #C8A8FF;
    color: #211038;
}

.tutor-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
    gap: 22px;
}

.tutor-card {
    background: #30164A;
    padding: 22px;
    border-radius: 14px;
    border: 1px solid #51366c;
    display: flex;
    flex-direction: column;
}

.tutor-photo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    background: #51366c;
    margin-bottom: 15px;
}

.tutor-card h3 {
    color: #E7DBFF;
    margin: 5px 0;
}

.tutor-card p {
    color: #D8CDE5;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.video-section {
    margin-top: 15px;
}

.video-title {
    color: #E7DBFF;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 10px;
}

.tutor-video {
    width: 100%;
    max-height: 230px;
    display: block;
    border-radius: 10px;
    background: #211038;
    object-fit: contain;
}

.no-video {
    background: #3B2058;
    border: 1px dashed #80649c;
    border-radius: 10px;
    padding: 15px;
    color: #D8CDE5;
    font-size: 13px;
    line-height: 1.5;
    text-align: center;
}

.rate {
    color: #C8A8FF !important;
    font-weight: bold;
    margin-top: auto;
    padding-top: 12px;
}

.book-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: #C8A8FF;
    color: #211038;
    padding: 14px;
    border-radius: 8px;
    font-weight: bold;
    margin-top: 15px;
}

.book-btn:hover {
    background: #E7DBFF;
}

/* Public tutor reviews */

.reviews-section {
    margin-top: 22px;
    padding-top: 16px;
    border-top: 1px solid #604779;
}

.reviews-heading {
    color: #E7DBFF;
    font-size: 17px;
    margin: 0 0 12px;
}

.rating-summary {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 14px;
}

.average-rating {
    color: #fff;
    font-size: 25px;
    font-weight: bold;
}

.stars {
    color: #FFD166;
    letter-spacing: 2px;
    font-size: 17px;
}

.review-count {
    color: #D8CDE5;
    font-size: 13px;
}

.review-card {
    background: #3B2058;
    border: 1px solid #604779;
    border-radius: 9px;
    padding: 13px;
    margin-bottom: 10px;
}

.review-card .review-stars {
    color: #FFD166;
    letter-spacing: 2px;
    margin-bottom: 7px;
}

.review-text {
    color: #F0E8FA;
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
    margin: 5px 0 9px;
    white-space: pre-wrap;
}

.review-date {
    color: #BDAACF;
    font-size: 12px;
}

.no-reviews {
    background: #3B2058;
    border: 1px dashed #80649c;
    border-radius: 9px;
    padding: 13px;
    color: #D8CDE5;
    font-size: 13px;
    line-height: 1.5;
}

.reviews-error {
    color: #FFD166;
    font-size: 13px;
    line-height: 1.5;
}

#status {
    color: #D8CDE5;
    margin: 20px 0;
}

@media(max-width: 600px) {
    header {
        align-items: flex-start;
    }

    nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
}
</style></head><body><header>
    <h2>Tutor Pearl</h2><nav>
    <a href="index.html">Home</a>
    <a href="student-dashboard.html">Dashboard</a>
    <a href="tutor-login.html">Tutor Login</a>
</nav>

</header><main class="container"><h1>Find Your Perfect Tutor</h1>

<p class="intro">
    Discover qualified tutors, explore their teaching experience
    and request a lesson that suits your learning goals.
</p>

<div class="search-box">
    <input
        type="search"
        id="searchInput"
        placeholder="Search by tutor, subject or language..."
    >

    <button class="search-btn" id="searchButton">
        Search
    </button>
</div>

<p id="status">Loading approved tutors...</p>

<div class="tutor-grid" id="tutorGrid"></div>

</main><script type="module">

import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://chmdsvfmlscrbqomqifp.supabase.co";
const SUPABASE_KEY = "sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const tutorGrid = document.getElementById("tutorGrid");
const statusText = document.getElementById("status");
const searchInput = document.getElementById("searchInput");

let tutors = [];
let reviewsByTutor = new Map();
let reviewsAvailable = true;

function createTextElement(tag, className, text) {
    const element = document.createElement(tag);

    if (className) {
        element.className = className;
    }

    element.textContent = text || "";

    return element;
}

function formatDate(dateString) {

    const date = new Date(dateString);

    if (Number.isNaN(date.getTime())) {
        return "";
    }

    return date.toLocaleDateString("en", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}

function getStars(rating) {

    const roundedRating = Math.round(Number(rating) || 0);

    return "★".repeat(roundedRating) +
           "☆".repeat(5 - roundedRating);
}

function addIntroductionVideo(card, tutor) {

    const section = document.createElement("div");
    section.className = "video-section";

    section.appendChild(
        createTextElement(
            "p",
            "video-title",
            "Meet Your Tutor"
        )
    );

    if (tutor.intro_video_url) {

        const video = document.createElement("video");

        video.className = "tutor-video";
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;

        const source = document.createElement("source");

        source.src = tutor.intro_video_url;
        source.type = "video/mp4";

        video.appendChild(source);

        video.appendChild(
            document.createTextNode(
                "Your browser does not support video playback."
            )
        );

        video.addEventListener("error", () => {

            const message = createTextElement(
                "p",
                "no-video",
                "This introduction video could not be loaded. Please try again later."
            );

            section.replaceChildren(
                createTextElement("p", "video-title", "Meet Your Tutor"),
                message
            );
        });

        section.appendChild(video);

    } else {

        section.appendChild(
            createTextElement(
                "p",
                "no-video",
                "This tutor has not uploaded an introduction video yet."
            )
        );

    }

    card.appendChild(section);
}

function addTutorReviews(card, tutor) {

    const section = document.createElement("section");
    section.className = "reviews-section";

    section.appendChild(
        createTextElement(
            "h4",
            "reviews-heading",
            "Student Reviews"
        )
    );

    if (!reviewsAvailable) {

        section.appendChild(
            createTextElement(
                "p",
                "reviews-error",
                "Student reviews are temporarily unavailable."
            )
        );

        card.appendChild(section);
        return;
    }

    const reviews = reviewsByTutor.get(tutor.id) || [];

    if (reviews.length === 0) {

        section.appendChild(
            createTextElement(
                "p",
                "no-reviews",
                "No student reviews yet. Be the first to share your learning experience after completing a lesson."
            )
        );

        card.appendChild(section);
        return;
    }

    const totalReviews = reviews.length;

    const averageRating =
        reviews.reduce(
            (total, review) => total + Number(review.rating),
            0
        ) / totalReviews;

    const summary = document.createElement("div");
    summary.className = "rating-summary";

    summary.appendChild(
        createTextElement(
            "span",
            "average-rating",
            averageRating.toFixed(1)
        )
    );

    summary.appendChild(
        createTextElement(
            "span",
            "stars",
            getStars(averageRating)
        )
    );

    summary.appendChild(
        createTextElement(
            "span",
            "review-count",
            "(" + totalReviews + " " +
            (totalReviews === 1 ? "review" : "reviews") + ")"
        )
    );

    section.appendChild(summary);

    // Display the three most recent reviews.
    reviews.slice(0, 3).forEach(review => {

        const reviewCard = document.createElement("div");
        reviewCard.className = "review-card";

        reviewCard.appendChild(
            createTextElement(
                "div",
                "review-stars",
                getStars(review.rating)
            )
        );

        if (review.review_text) {

            reviewCard.appendChild(
                createTextElement(
                    "p",
                    "review-text",
                    review.review_text
                )
            );

        } else {

            reviewCard.appendChild(
                createTextElement(
                    "p",
                    "review-text",
                    "The student left a rating without written feedback."
                )
            );

        }

        reviewCard.appendChild(
            createTextElement(
                "span",
                "review-date",
                formatDate(review.created_at)
            )
        );

        section.appendChild(reviewCard);
    });

    card.appendChild(section);
}

function renderTutors(list) {

    tutorGrid.innerHTML = "";

    if (!list.length) {

        statusText.textContent =
            "No approved tutors match your search. Please try another search.";

        return;
    }

    statusText.textContent =
        list.length + " approved tutor(s) found.";

    list.forEach(tutor => {

        const card = document.createElement("article");
        card.className = "tutor-card";

        if (tutor.profile_photo_url) {

            const photo = document.createElement("img");

            photo.className = "tutor-photo";
            photo.src = tutor.profile_photo_url;
            photo.alt = "Photo of " + (tutor.full_name || "tutor");
            photo.loading = "lazy";

            photo.onerror = () => {
                photo.style.display = "none";
            };

            card.appendChild(photo);
        }

        const profileLink = document.createElement("a");

profileLink.href =
    "tutor-public-profile.html?id=" + encodeURIComponent(tutor.id);

profileLink.style.color = "#E7DBFF";
profileLink.style.textDecoration = "none";
profileLink.style.fontWeight = "bold";
profileLink.style.fontSize = "20px";
profileLink.textContent = tutor.full_name || "Tutor";

const tutorName = document.createElement("h3");
tutorName.appendChild(profileLink);

card.appendChild(tutorName);

        card.appendChild(
            createTextElement(
                "p",
                "",
                tutor.headline || "Professional Tutor"
            )
        );

        card.appendChild(
            createTextElement(
                "p",
                "",
                "Subjects: " + (tutor.subjects || "Not listed")
            )
        );

        card.appendChild(
            createTextElement(
                "p",
                "",
                "Languages: " + (tutor.teaching_languages || "Not listed")
            )
        );

        card.appendChild(
            createTextElement(
                "p",
                "",
                "Qualifications: " + (tutor.qualifications || "Not listed")
            )
        );

        card.appendChild(
            createTextElement(
                "p",
                "",
                tutor.biography || "No biography available yet."
            )
        );

        addIntroductionVideo(card, tutor);

        // Display public tutor ratings and reviews.
        addTutorReviews(card, tutor);

        const rate = tutor.hourly_rate != null
            ? (tutor.currency || "USD") + " " + tutor.hourly_rate + " per hour"
            : "Rate not listed";

        card.appendChild(
            createTextElement("p", "rate", rate)
        );

        const bookButton = document.createElement("a");

        bookButton.className = "book-btn";
        bookButton.textContent = "Book a Lesson";
        bookButton.href =
            "book-lesson.html?tutor=" + encodeURIComponent(tutor.id);

        card.appendChild(bookButton);

        tutorGrid.appendChild(card);
    });
}

async function loadReviews() {

    reviewsAvailable = true;
    reviewsByTutor = new Map();

    const { data, error } = await supabase
        .from("tutor_reviews")
        .select("tutor_id, rating, review_text, created_at")
        .order("created_at", { ascending: false });

    if (error) {

        console.error("Unable to load tutor reviews:", error);

        reviewsAvailable = false;

        return;
    }

    (data || []).forEach(review => {

        if (!reviewsByTutor.has(review.tutor_id)) {
            reviewsByTutor.set(review.tutor_id, []);
        }

        reviewsByTutor.get(review.tutor_id).push(review);
    });
}

async function loadTutors() {

    statusText.textContent = "Loading approved tutors...";

    const { data, error } = await supabase
        .from("tutor_profiles")
        .select(`
            id,
            full_name,
            headline,
            subjects,
            hourly_rate,
            currency,
            teaching_languages,
            qualifications,
            biography,
            profile_photo_url,
            intro_video_url
        `)
        .eq("approval_status", "approved")
        .order("created_at", { ascending: false });

    if (error) {

        console.error("Unable to load tutors:", error);

        statusText.textContent =
            "Unable to load tutors. Please refresh the page.";

        return;
    }

    tutors = data || [];

    // Load reviews after retrieving approved tutors.
    await loadReviews();

    renderTutors(tutors);
}

function searchTutors() {

    const term = searchInput.value.trim().toLowerCase();

    if (!term) {

        renderTutors(tutors);

        return;
    }

    const filtered = tutors.filter(tutor => {

        const searchableText = [
            tutor.full_name,
            tutor.headline,
            tutor.subjects,
            tutor.teaching_languages,
            tutor.qualifications,
            tutor.biography
        ].join(" ").toLowerCase();

        return searchableText.includes(term);
    });

    renderTutors(filtered);
}

document.getElementById("searchButton")
    .addEventListener("click", searchTutors);

searchInput.addEventListener("input", searchTutors);

loadTutors();

</script></body>
</html>
