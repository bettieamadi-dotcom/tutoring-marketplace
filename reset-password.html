<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Tutor Pearl</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #211038;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #30164A;
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      border-radius: 18px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.25);
    }

    .brand {
      text-align: center;
      color: #C8A8FF;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    h1 {
      text-align: center;
      margin-bottom: 12px;
      font-size: 25px;
    }

    .intro {
      text-align: center;
      color: #D8CDE5;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #755B91;
      border-radius: 8px;
      background: #211038;
      color: white;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 22px;
      background: #C8A8FF;
      color: #211038;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #C8A8FF;
      text-decoration: none;
    }

    .hidden {
      display: none;
    }
  </style></head><body>  <main class="card"><div class="brand">Tutor Pearl</div>

<section id="requestSection">
  <h1>Forgot Password?</h1>

  <p class="intro">
    Enter your registered email address. We'll send you a link
    to reset your password.
  </p>

  <form id="requestForm">
    <label for="email">Email Address</label>

    <input
      type="email"
      id="email"
      autocomplete="email"
      required
    >

    <button type="submit" id="requestButton">
      Send Reset Link
    </button>
  </form>
</section>

<section id="updateSection" class="hidden">
  <h1>Create a New Password</h1>

  <p class="intro">
    Enter your new password below.
  </p>

  <form id="updateForm">
    <label for="newPassword">New Password</label>

    <input
      type="password"
      id="newPassword"
      minlength="8"
      autocomplete="new-password"
      required
    >

    <label for="confirmPassword">Confirm New Password</label>

    <input
      type="password"
      id="confirmPassword"
      minlength="8"
      autocomplete="new-password"
      required
    >

    <button type="submit" id="updateButton">
      Update Password
    </button>
  </form>
</section>

<p id="message" aria-live="polite"></p>

<a href="student-login.html" class="back-link">
  Back to Student Login
</a>

  </main>  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL =
      'https://chmdsvfmlscrbqomqifp.supabase.co';

    const SUPABASE_PUBLISHABLE_KEY =
      'sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ';

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const requestSection =
      document.getElementById('requestSection');

    const updateSection =
      document.getElementById('updateSection');

    const message =
      document.getElementById('message');

    let recoverySessionReady = false;

    function showUpdateForm() {
      recoverySessionReady = true;
      requestSection.classList.add('hidden');
      updateSection.classList.remove('hidden');
      message.textContent = '';
    }

    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        showUpdateForm();
      }
    });

    const { data: sessionData } =
      await supabase.auth.getSession();

    if (sessionData.session) {
      showUpdateForm();
    }

    document.getElementById('requestForm')
      .addEventListener('submit', async (event) => {
        event.preventDefault();

        const email =
          document.getElementById('email').value.trim();

        const button =
          document.getElementById('requestButton');

        button.disabled = true;
        message.textContent = 'Sending reset link...';

        const { error } =
          await supabase.auth.resetPasswordForEmail(email, {
            redirectTo:
              'https://tutor-pearl.pages.dev/reset-password.html'
          });

        button.disabled = false;

        if (error) {
          message.textContent = error.message;
          return;
        }

        message.textContent =
          'If an account exists for this email, a password reset link will be sent. Check your inbox and spam folder.';
      });

    document.getElementById('updateForm')
      .addEventListener('submit', async (event) => {
        event.preventDefault();

        if (!recoverySessionReady) {
          message.textContent =
            'Please open the password reset link from your email first.';
          return;
        }

        const password =
          document.getElementById('newPassword').value;

        const confirmPassword =
          document.getElementById('confirmPassword').value;

        if (password.length < 8) {
          message.textContent =
            'Your password must contain at least 8 characters.';
          return;
        }

        if (password !== confirmPassword) {
          message.textContent =
            'The passwords do not match.';
          return;
        }

        const button =
          document.getElementById('updateButton');

        button.disabled = true;
        message.textContent = 'Updating your password...';

        const { error } =
          await supabase.auth.updateUser({
            password: password
          });

        button.disabled = false;

        if (error) {
          message.textContent = error.message;
          return;
        }

        await supabase.auth.signOut();

        message.textContent =
          'Your password has been updated successfully. You can now sign in with your new password.';
      });
  </script></body>
</html>
