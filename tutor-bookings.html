<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | Tutor Pearl</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#211038;color:white;padding:20px}
.container{max-width:950px;margin:25px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{color:#E7DBFF}
p{color:#D8CDE5;line-height:1.5}
a{color:#C8A8FF;text-decoration:none}
button{padding:11px 17px;border:0;border-radius:7px;font-weight:bold;cursor:pointer}
.refresh{background:#C8A8FF;color:#211038}
.booking{background:#30164A;border:1px solid #51366c;padding:20px;border-radius:12px;margin:18px 0}
.booking h3{color:#E7DBFF;margin-top:0}
.detail{margin:8px 0;color:#D8CDE5;overflow-wrap:anywhere}
.status{display:inline-block;padding:6px 10px;border-radius:20px;background:#51366c;color:#E7DBFF;font-size:13px}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.accept{background:#A6E8C1;color:#173D2A}
.decline{background:#F2A6A6;color:#512020}
.message{padding:13px;border-radius:8px;margin:15px 0;display:none}
.error{background:#5a2525;color:#ffe0e0}
.success{background:#174c35;color:#c7ffdf}
.empty{background:#30164A;padding:22px;border-radius:10px}
</style></head><body>
<div class="container"><header>
    <div>
        <h1>My Bookings</h1>
        <p>View and manage lesson requests from your students.</p>
    </div>
    <button class="refresh" id="refreshButton">Refresh Bookings</button>
</header><p><a href="tutor-dashboard.html">← Back to Tutor Dashboard</a></p><div id="message" class="message"></div>
<div id="bookingList">Loading your bookings...</div></div><script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://chmdsvfmlscrbqomqifp.supabase.co";
const SUPABASE_KEY = "sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const bookingList = document.getElementById("bookingList");
const messageBox = document.getElementById("message");
const refreshButton = document.getElementById("refreshButton");

let currentUser = null;

function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
    messageBox.style.display = "block";
}

function addText(parent, tag, className, text) {
    const element = document.createElement(tag);
    element.className = className;
    element.textContent = text;
    parent.appendChild(element);
    return element;
}

function formatDate(date) {
    if (!date) return "Not specified";

    return new Date(date + "T00:00:00").toLocaleDateString(
        undefined,
        {day:"numeric", month:"long", year:"numeric"}
    );
}

function formatTime(time) {
    if (!time) return "Not specified";

    const parts = time.split(":");
    const date = new Date();
    date.setHours(Number(parts[0]), Number(parts[1]), 0, 0);

    return date.toLocaleTimeString([], {
        hour:"numeric",
        minute:"2-digit"
    });
}

async function checkAccess() {
    const {data, error} = await supabase.auth.getUser();

    if (error || !data.user) {
        window.location.href = "tutor-login.html";
        return false;
    }

    currentUser = data.user;

    if (currentUser.user_metadata?.account_type !== "tutor") {
        bookingList.textContent = "Please log in with your tutor account.";
        return false;
    }

    return true;
}

async function loadBookings() {
    refreshButton.disabled = true;
    refreshButton.textContent = "Loading...";

    bookingList.textContent = "Loading your bookings...";

    const {data, error} = await supabase
        .from("lesson_bookings")
        .select(`
            id,
            student_id,
            subject,
            lesson_date,
            start_time,
            duration_minutes,
            student_message,
            status,
            created_at
        `)
        .eq("tutor_id", currentUser.id)
        .order("created_at", {ascending:false});

    refreshButton.disabled = false;
    refreshButton.textContent = "Refresh Bookings";

    if (error) {
        console.error(error);
        bookingList.textContent = "Unable to load bookings: " + error.message;
        return;
    }

    bookingList.innerHTML = "";

    if (!data || data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        addText(empty, "h3", "", "No booking requests yet");
        addText(empty, "p", "", "New lesson requests from students will appear here.");
        bookingList.appendChild(empty);
        return;
    }

    data.forEach(booking => {
        const card = document.createElement("div");
        card.className = "booking";

        addText(card, "h3", "", booking.subject || "Lesson request");

        addText(card, "p", "detail",
            "Student reference: " + booking.student_id);

        addText(card, "p", "detail",
            "Date: " + formatDate(booking.lesson_date));

        addText(card, "p", "detail",
            "Start time: " + formatTime(booking.start_time));

        addText(card, "p", "detail",
            "Duration: " + booking.duration_minutes + " minutes");

        addText(card, "p", "detail",
            "Message: " + (booking.student_message || "No message provided."));

        addText(card, "span", "status",
            "Status: " + booking.status);

        if (booking.status === "pending") {
            const actions = document.createElement("div");
            actions.className = "actions";

            const acceptButton = document.createElement("button");
            acceptButton.className = "accept";
            acceptButton.textContent = "Accept Request";
            acceptButton.addEventListener("click", () =>
                respondToBooking(booking.id, "accepted", acceptButton, declineButton)
            );

            const declineButton = document.createElement("button");
            declineButton.className = "decline";
            declineButton.textContent = "Decline Request";
            declineButton.addEventListener("click", () =>
                respondToBooking(booking.id, "declined", acceptButton, declineButton)
            );

            actions.append(acceptButton, declineButton);
            card.appendChild(actions);
        }

        bookingList.appendChild(card);
    });
}

async function respondToBooking(id, decision, acceptButton, declineButton) {
    const confirmed = window.confirm(
        "Are you sure you want to " + decision + " this booking request?"
    );

    if (!confirmed) return;

    acceptButton.disabled = true;
    declineButton.disabled = true;

    const {data, error} = await supabase.rpc(
        "tutor_respond_to_booking",
        {
            booking_id: id,
            decision: decision
        }
    );

    if (error) {
        showMessage("Could not update booking: " + error.message, "error");
        acceptButton.disabled = false;
        declineButton.disabled = false;
        return;
    }

    if (data !== true) {
        showMessage("This booking could not be updated. It may no longer be pending.", "error");
        await loadBookings();
        return;
    }

    showMessage("Booking successfully " + decision + ".", "success");
    await loadBookings();
}

refreshButton.addEventListener("click", loadBookings);

async function initialize() {
    const allowed = await checkAccess();

    if (allowed) {
        await loadBookings();
    }
}

initialize();
</script></body>
</html>
