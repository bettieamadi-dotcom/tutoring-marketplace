
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookings | Tutor Pearl</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #211038;
    color: white;
    padding: 20px;
}

.container {
    max-width: 950px;
    margin: 25px auto;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

h1 {
    color: #E7DBFF;
}

p {
    color: #D8CDE5;
    line-height: 1.5;
}

a {
    color: #C8A8FF;
    text-decoration: none;
}

button {
    padding: 11px 17px;
    border: 0;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.refresh {
    background: #C8A8FF;
    color: #211038;
}

.booking {
    background: #30164A;
    border: 1px solid #51366c;
    padding: 20px;
    border-radius: 12px;
    margin: 18px 0;
}

.booking h3 {
    color: #E7DBFF;
    margin-top: 0;
}

.detail {
    margin: 8px 0;
    color: #D8CDE5;
    overflow-wrap: anywhere;
}

.status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    background: #51366c;
    color: #E7DBFF;
    font-size: 13px;
}

.actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
}

.accept {
    background: #A6E8C1;
    color: #173D2A;
}

.decline {
    background: #F2A6A6;
    color: #512020;
}

.complete {
    background: #C8A8FF;
    color: #211038;
}

.generate-meet {
    background: #A6E8C1;
    color: #173D2A;
}

.join-meet {
    display: inline-block;
    padding: 11px 17px;
    border-radius: 7px;
    background: #C8A8FF;
    color: #211038;
    font-weight: bold;
    text-decoration: none;
}

.meet-section {
    margin-top: 18px;
    padding: 15px;
    background: #211038;
    border: 1px solid #65458a;
    border-radius: 10px;
}

.meet-section h4 {
    color: #E7DBFF;
    margin: 0 0 10px;
}

.meet-section p {
    margin: 8px 0;
}

.message {
    padding: 13px;
    border-radius: 8px;
    margin: 15px 0;
    display: none;
    overflow-wrap: anywhere;
}

.error {
    background: #5a2525;
    color: #ffe0e0;
}

.success {
    background: #174c35;
    color: #c7ffdf;
}

.empty {
    background: #30164A;
    padding: 22px;
    border-radius: 10px;
}

.reschedule-section {
    margin-top: 22px;
    padding: 17px;
    background: #211038;
    border: 1px solid #65458a;
    border-radius: 10px;
}

.reschedule-section h4 {
    color: #E7DBFF;
    margin-top: 0;
    font-size: 17px;
}

.request-card {
    background: #3B2058;
    padding: 15px;
    border-radius: 9px;
    margin-top: 13px;
    border: 1px solid #65458a;
}

.request-card p {
    margin: 8px 0;
    overflow-wrap: anywhere;
}

.request-status {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: capitalize;
}

.request-pending {
    background: #fff0c2;
    color: #765000;
}

.request-approved {
    background: #A6E8C1;
    color: #173D2A;
}

.request-declined,
.request-cancelled {
    background: #F2A6A6;
    color: #512020;
}

.request-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

@media(max-width: 600px) {
    body {
        padding: 14px;
    }

    .booking {
        padding: 15px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div>
        <h1>My Bookings</h1>
        <p>View and manage lesson requests from your students.</p>
    </div>

    <button class="refresh" id="refreshButton">
        Refresh Bookings
    </button>
</header>

<p>
    <a href="tutor-dashboard.html">
        ← Back to Tutor Dashboard
    </a>
</p>

<div id="message" class="message"></div>

<div id="bookingList">
    Loading your bookings...
</div>

</div>

<script type="module">

import { createClient } from
"https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
"https://chmdsvfmlscrbqomqifp.supabase.co";

const SUPABASE_KEY =
"sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ";

const GOOGLE_MEET_FUNCTION_URL =
SUPABASE_URL + "/functions/v1/google-meet";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const bookingList =
document.getElementById("bookingList");

const messageBox =
document.getElementById("message");

const refreshButton =
document.getElementById("refreshButton");

let currentUser = null;
let loading = false;

function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
    messageBox.style.display = "block";
}

function hideMessage() {
    messageBox.style.display = "none";
}

function addText(parent, tag, className, text) {
    const element = document.createElement(tag);

    element.className = className;
    element.textContent = text;

    parent.appendChild(element);

    return element;
}

function formatDate(date) {
    if (!date) return "Not specified";

    return new Date(date + "T00:00:00").toLocaleDateString(
        undefined,
        {
            day: "numeric",
            month: "long",
            year: "numeric"
        }
    );
}

function formatTime(time) {
    if (!time) return "Not specified";

    const parts = time.split(":");
    const date = new Date();

    date.setHours(
        Number(parts[0]),
        Number(parts[1]),
        0,
        0
    );

    return date.toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
    });
}

async function checkAccess() {

    const { data, error } =
        await supabase.auth.getUser();

    if (error || !data.user) {
        window.location.href = "tutor-login.html";
        return false;
    }

    currentUser = data.user;

    if (
        currentUser.user_metadata?.account_type !== "tutor"
    ) {
        bookingList.textContent =
            "Please log in with your tutor account.";

        return false;
    }

    return true;
}

function createRequestStatus(status) {

    const allowed = [
        "pending",
        "approved",
        "declined",
        "cancelled"
    ];

    const safeStatus = allowed.includes(
        String(status).toLowerCase()
    )
        ? String(status).toLowerCase()
        : "pending";

    const badge = document.createElement("span");

    badge.className =
        "request-status request-" + safeStatus;

    badge.textContent = safeStatus;

    return badge;
}


/* GOOGLE MEET GENERATION */

async function generateGoogleMeet(
    bookingId,
    generateButton
) {

    const confirmed = window.confirm(
        "Generate a Google Meet link for this lesson? " +
        "The booking must be accepted and successfully paid."
    );

    if (!confirmed) return;

    generateButton.disabled = true;
    generateButton.textContent = "Generating meeting...";

    try {

        const {
            data: sessionData,
            error: sessionError
        } = await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        const session = sessionData.session;

        if (!session || !session.access_token) {
            throw new Error(
                "Your login session has expired. Please log in again."
            );
        }

        const response = await fetch(
            GOOGLE_MEET_FUNCTION_URL + "?action=create",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization":
                        "Bearer " + session.access_token
                },

                body: JSON.stringify({
                    booking_id: bookingId
                })
            }
        );

        const responseText = await response.text();

        let result = {};

        try {
            result = responseText
                ? JSON.parse(responseText)
                : {};
        } catch {
            result = {
                message: responseText
            };
        }

        if (
            !response.ok ||
            result.success === false
        ) {

            throw new Error(
                result.message ||
                result.error ||
                "Google Meet could not be generated. Please check the booking payment and try again."
            );
        }

        await loadBookings();

        showMessage(
            result.message ||
            "Google Meet meeting generated successfully. Your saved meeting link is now displayed in the booking.",
            "success"
        );

    } catch (error) {

        console.error(
            "Google Meet generation error:",
            error
        );

        showMessage(
            error.message ||
            "Unable to generate the Google Meet link.",
            "error"
        );

        generateButton.disabled = false;

        generateButton.textContent =
            "Generate Google Meet";
    }
}


/* DISPLAY GOOGLE MEET SECTION */

function renderGoogleMeet(booking, card) {

    const meetSection = document.createElement("div");

    meetSection.className = "meet-section";

    addText(
        meetSection,
        "h4",
        "",
        "Google Meet Lesson"
    );

    if (booking.google_meet_link) {

        let validMeetUrl = null;

        try {

            const parsedUrl = new URL(
                booking.google_meet_link
            );

            if (parsedUrl.protocol === "https:") {
                validMeetUrl = parsedUrl.href;
            }

        } catch (error) {
            console.error("Invalid saved Meet URL:", error);
        }

        if (validMeetUrl) {

            addText(
                meetSection,
                "p",
                "",
                "Your Google Meet link is ready."
            );

            const joinLink =
                document.createElement("a");

            joinLink.className = "join-meet";

            joinLink.href = validMeetUrl;

            joinLink.target = "_blank";

            joinLink.rel = "noopener noreferrer";

            joinLink.textContent = "Join Google Meet";

            meetSection.appendChild(joinLink);

        } else {

            addText(
                meetSection,
                "p",
                "",
                "A meeting link is saved, but it could not be opened safely. Please contact support."
            );
        }

    } else if (
        booking.booking_status === "accepted"
    ) {

        addText(
            meetSection,
            "p",
            "",
            "Generate a Google Meet link for this accepted lesson. A successful payment is required."
        );

        const generateButton =
            document.createElement("button");

        generateButton.className = "generate-meet";

        generateButton.textContent =
            "Generate Google Meet";

        generateButton.addEventListener(
            "click",
            () => generateGoogleMeet(
                booking.booking_id,
                generateButton
            )
        );

        meetSection.appendChild(generateButton);

    } else {

        addText(
            meetSection,
            "p",
            "",
            "A Google Meet link will be available after this booking is accepted."
        );
    }

    card.appendChild(meetSection);
}


/* RESCHEDULE REVIEW */

async function reviewReschedule(
    requestId,
    decision,
    approveButton,
    declineButton
) {

    const actionText =
        decision === "approved" ? "approve" : "decline";

    const confirmed = window.confirm(
        "Are you sure you want to " +
        actionText +
        " this rescheduling request?"
    );

    if (!confirmed) return;

    approveButton.disabled = true;
    declineButton.disabled = true;

    try {

        const { data, error } = await supabase.rpc(
            "tutor_review_reschedule",
            {
                p_request_id: requestId,
                p_decision: decision
            }
        );

        if (error) throw error;

        if (data !== true) {
            throw new Error(
                "The rescheduling request could not be updated."
            );
        }

        await loadBookings();

        showMessage(
            decision === "approved"
                ? "Rescheduling request approved. The original booking has been updated."
                : "Rescheduling request declined. The original booking remains unchanged.",
            "success"
        );

    } catch (error) {

        console.error(
            "Rescheduling review error:",
            error
        );

        showMessage(
            error.message ||
            "Unable to process the rescheduling request.",
            "error"
        );

        approveButton.disabled = false;
        declineButton.disabled = false;
    }
}


/* DISPLAY RESCHEDULE REQUESTS */

function renderRescheduleRequests(
    booking,
    requests
) {

    const bookingRequests = requests.filter(
        request =>
            request.booking_id === booking.booking_id
    );

    if (!bookingRequests.length) return null;

    const section = document.createElement("div");

    section.className = "reschedule-section";

    addText(
        section,
        "h4",
        "",
        "Student Rescheduling Requests"
    );

    bookingRequests.forEach(request => {

        const card = document.createElement("div");

        card.className = "request-card";

        addText(
            card,
            "p",
            "detail",
            "Requested date: " +
            formatDate(request.requested_date)
        );

        addText(
            card,
            "p",
            "detail",
            "Requested time: " +
            formatTime(request.requested_start_time)
        );

        const statusLine = document.createElement("p");

        const statusLabel = document.createElement("strong");

        statusLabel.textContent = "Request status: ";

        statusLine.appendChild(statusLabel);

        statusLine.appendChild(
            createRequestStatus(request.status)
        );

        card.appendChild(statusLine);

        if (request.student_message) {

            addText(
                card,
                "p",
                "detail",
                "Student's message: " +
                request.student_message
            );
        }

        if (request.status === "pending") {

            const actions = document.createElement("div");

            actions.className = "request-actions";

            const approveButton =
                document.createElement("button");

            approveButton.className = "accept";

            approveButton.textContent =
                "Approve New Time";

            const declineButton =
                document.createElement("button");

            declineButton.className = "decline";

            declineButton.textContent =
                "Decline Request";

            approveButton.addEventListener("click", () => {

                reviewReschedule(
                    request.id,
                    "approved",
                    approveButton,
                    declineButton
                );

            });

            declineButton.addEventListener("click", () => {

                reviewReschedule(
                    request.id,
                    "declined",
                    approveButton,
                    declineButton
                );

            });

            actions.append(
                approveButton,
                declineButton
            );

            card.appendChild(actions);
        }

        section.appendChild(card);
    });

    return section;
}


/* MARK LESSON AS COMPLETED */

async function completeLesson(
    bookingId,
    completeButton
) {

    const confirmed = window.confirm(
        "Are you sure this lesson has been completed?"
    );

    if (!confirmed) return;

    completeButton.disabled = true;
    completeButton.textContent = "Processing...";

    try {

        const { data, error } = await supabase.rpc(
            "tutor_complete_lesson",
            {
                p_booking_id: bookingId
            }
        );

        if (error) throw error;

        if (data !== true) {
            throw new Error(
                "The lesson could not be marked as completed."
            );
        }

        await loadBookings();

        showMessage(
            "Lesson successfully marked as completed. The student can now submit a review.",
            "success"
        );

    } catch (error) {

        console.error(
            "Lesson completion error:",
            error
        );

        showMessage(
            error.message ||
            "Unable to complete this lesson.",
            "error"
        );

        completeButton.disabled = false;
        completeButton.textContent =
            "Mark Lesson as Completed";
    }
}


/* LOAD BOOKINGS */

async function loadBookings() {

    if (loading) return;

    loading = true;

    refreshButton.disabled = true;

    refreshButton.textContent = "Loading...";

    bookingList.textContent =
        "Loading your bookings...";

    hideMessage();

    try {

        const allowed = await checkAccess();

        if (!allowed) return;

        const {
            data: bookings,
            error: bookingError
        } = await supabase.rpc(
            "tutor_get_my_bookings"
        );

        if (bookingError) throw bookingError;

        const {
            data: requests,
            error: requestError
        } = await supabase.rpc(
            "get_my_reschedule_requests"
        );

        if (requestError) throw requestError;

        const rescheduleRequests = requests || [];

        bookingList.innerHTML = "";

        if (!bookings || bookings.length === 0) {

            const empty = document.createElement("div");

            empty.className = "empty";

            addText(
                empty,
                "h3",
                "",
                "No booking requests yet"
            );

            addText(
                empty,
                "p",
                "",
                "New lesson requests from students will appear here."
            );

            bookingList.appendChild(empty);

            return;
        }

        bookings.forEach(booking => {

            const card = document.createElement("div");

            card.className = "booking";

            addText(
                card,
                "h3",
                "",
                booking.subject || "Lesson request"
            );

            addText(
                card,
                "p",
                "detail",
                "Student name: " +
                (booking.student_name || "Student")
            );

            addText(
                card,
                "p",
                "detail",
                "Date: " +
                formatDate(booking.lesson_date)
            );

            addText(
                card,
                "p",
                "detail",
                "Start time: " +
                formatTime(booking.start_time)
            );

            addText(
                card,
                "p",
                "detail",
                "Duration: " +
                booking.duration_minutes +
                " minutes"
            );

            addText(
                card,
                "p",
                "detail",
                "Message: " +
                (booking.student_message ||
                "No message provided.")
            );

            addText(
                card,
                "span",
                "status",
                "Status: " + booking.booking_status
            );


            /* ACCEPT OR DECLINE BOOKING */

            if (
                booking.booking_status === "pending"
            ) {

                const actions =
                    document.createElement("div");

                actions.className = "actions";

                const acceptButton =
                    document.createElement("button");

                acceptButton.className = "accept";

                acceptButton.textContent =
                    "Accept Request";

                const declineButton =
                    document.createElement("button");

                declineButton.className = "decline";

                declineButton.textContent =
                    "Decline Request";

                acceptButton.addEventListener(
                    "click",
                    () => respondToBooking(
                        booking.booking_id,
                        "accepted",
                        acceptButton,
                        declineButton
                    )
                );

                declineButton.addEventListener(
                    "click",
                    () => respondToBooking(
                        booking.booking_id,
                        "declined",
                        acceptButton,
                        declineButton
                    )
                );

                actions.append(
                    acceptButton,
                    declineButton
                );

                card.appendChild(actions);
            }


            /* GOOGLE MEET SECTION */

            renderGoogleMeet(booking, card);


            /* MARK ACCEPTED LESSON AS COMPLETED */

            if (
                booking.booking_status === "accepted"
            ) {

                const actions =
                    document.createElement("div");

                actions.className = "actions";

                const completeButton =
                    document.createElement("button");

                completeButton.className = "complete";

                completeButton.textContent =
                    "Mark Lesson as Completed";

                completeButton.addEventListener(
                    "click",
                    () => completeLesson(
                        booking.booking_id,
                        completeButton
                    )
                );

                actions.appendChild(completeButton);

                card.appendChild(actions);
            }


            /* DISPLAY RESCHEDULING REQUESTS */

            const rescheduleSection =
                renderRescheduleRequests(
                    booking,
                    rescheduleRequests
                );

            if (rescheduleSection) {
                card.appendChild(rescheduleSection);
            }

            bookingList.appendChild(card);
        });

    } catch (error) {

        console.error(
            "Tutor bookings error:",
            error
        );

        bookingList.textContent =
            "Unable to load bookings: " +
            error.message;

    } finally {

        loading = false;

        refreshButton.disabled = false;

        refreshButton.textContent =
            "Refresh Bookings";
    }
}


/* ACCEPT OR DECLINE BOOKING */

async function respondToBooking(
    id,
    decision,
    acceptButton,
    declineButton
) {

    const confirmed = window.confirm(
        "Are you sure you want to " +
        decision +
        " this booking request?"
    );

    if (!confirmed) return;

    acceptButton.disabled = true;
    declineButton.disabled = true;

    try {

        const { data, error } = await supabase.rpc(
            "tutor_respond_to_booking",
            {
                booking_id: id,
                decision: decision
            }
        );

        if (error) throw error;

        if (data !== true) {

            showMessage(
                "This booking could not be updated. It may no longer be pending.",
                "error"
            );

            await loadBookings();

            return;
        }

        await loadBookings();

        showMessage(
            "Booking successfully " + decision + ".",
            "success"
        );

    } catch (error) {

        console.error(
            "Booking response error:",
            error
        );

        showMessage(
            "Could not update booking: " +
            error.message,
            "error"
        );

        acceptButton.disabled = false;
        declineButton.disabled = false;
    }
}


refreshButton.addEventListener(
    "click",
    loadBookings
);

loadBookings();

</script>

</body>
</html>
