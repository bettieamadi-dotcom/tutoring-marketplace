<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Become a Tutor | Tutor Pearl</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: #211038;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 30px;
      background: #30164A;
      border-radius: 16px;
    }

    h1 {
      text-align: center;
      color: #E7DBFF;
    }

    p {
      text-align: center;
      color: #D8CDE5;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #C8A8FF;
      border-radius: 8px;
      background: white;
      color: #211038;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #C8A8FF;
      color: #211038;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    a {
      color: #E7DBFF;
    }
  </style></head><body>  <div class="container"><h1>Become a Tutor at Tutor Pearl</h1>

<p>
  Share your knowledge, inspire learners, and grow your teaching career.
  Create your tutor account to join our learning community.
</p>

<form id="signupForm">

  <label for="fullName">Full Name</label>
  <input type="text" id="fullName" required>

  <label for="email">Email Address</label>
  <input type="email" id="email" required>

  <label for="password">Password</label>
  <input type="password" id="password" minlength="8" required>

  <label for="headline">Professional Headline</label>
  <input
    type="text"
    id="headline"
    placeholder="Experienced English and Mathematics Tutor"
    required
  >

  <label for="subjects">Subjects You Teach</label>
  <input
    type="text"
    id="subjects"
    placeholder="English, Mathematics, Igbo"
    required
  >

  <label for="rate">Hourly Rate (USD)</label>
  <input
    type="number"
    id="rate"
    min="1"
    step="0.01"
    required
  >

  <label for="languages">Languages You Speak</label>
  <input
    type="text"
    id="languages"
    placeholder="English, Igbo, French"
  >

  <label for="qualifications">Qualifications</label>
  <textarea
    id="qualifications"
    placeholder="List your certificates, degrees, and teaching experience"
  ></textarea>

  <label for="biography">About You</label>
  <textarea
    id="biography"
    placeholder="Tell learners about your teaching experience and approach"
    required
  ></textarea>

  <button type="submit" id="submitButton">
    Create Tutor Account
  </button>

</form>

<div id="message" role="status" aria-live="polite"></div>

  </div>  <script type="module">

    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    const supabase = createClient(
      'https://chmdsvfmlscrbqomqifp.supabase.co',
      'sb_publishable_A1NbTHmXm8gqCDsj-EKFwQ_3SvQ6nPZ'
    );

    const form = document.getElementById('signupForm');
    const message = document.getElementById('message');
    const button = document.getElementById('submitButton');

    form.addEventListener('submit', async (event) => {

      event.preventDefault();

      button.disabled = true;
      button.textContent = 'Creating your account...';
      message.textContent = '';

      const fullName =
        document.getElementById('fullName').value.trim();

      const email =
        document.getElementById('email').value.trim();

      const password =
        document.getElementById('password').value;

      const headline =
        document.getElementById('headline').value.trim();

      const subjects = document.getElementById('subjects')
        .value.split(',')
        .map(item => item.trim())
        .filter(Boolean);

      const rate =
        Number(document.getElementById('rate').value);

      const languages = document.getElementById('languages')
        .value.split(',')
        .map(item => item.trim())
        .filter(Boolean);

      const qualifications =
        document.getElementById('qualifications').value.trim();

      const biography =
        document.getElementById('biography').value.trim();

      if (!Number.isFinite(rate) || rate <= 0) {
        message.textContent = 'Please enter a valid hourly rate.';
        button.disabled = false;
        button.textContent = 'Create Tutor Account';
        return;
      }

      try {

        const { data, error } = await supabase.auth.signUp({

          email: email,
          password: password,

          options: {
            data: {
              full_name: fullName,
              account_type: 'tutor',
              headline: headline,
              subjects: subjects.join(','),
              hourly_rate: String(rate),
              teaching_languages: languages.join(','),
              qualifications: qualifications,
              biography: biography
            }
          }

        });

        if (error) {
          throw error;
        }

        if (!data.user) {
          throw new Error('Account creation could not be confirmed. Please try again.');
        }

        message.textContent =
          'Your tutor account and profile have been created. Please check your email to confirm your address. Your profile is awaiting approval.';

        form.reset();

        button.textContent = 'Account Created';

      } catch (error) {

        console.error('Tutor signup error:', error);

        message.textContent =
          error.message || 'Something went wrong. Please try again.';

        button.textContent = 'Create Tutor Account';

      } finally {

        if (button.textContent !== 'Account Created') {
          button.disabled = false;
        }

      }

    });

  </script></body>
</html>
